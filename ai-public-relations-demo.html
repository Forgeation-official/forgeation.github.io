<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Forgeation AI広報社員デモ">
<title>Forgeation AI広報社員デモ</title>
<style>
:root{
  --navy:#07162f;
  --blue:#0d63d8;
  --cyan:#49d9ff;
  --gold:#f4c95d;
  --orange:#ff7a2f;
  --paper:#f5f8fd;
  --ink:#14233d;
  --line:rgba(13,99,216,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at top right,rgba(73,217,255,.16),transparent 28%),
    linear-gradient(180deg,#eef5ff,#f9fbff 55%,#fff);
}
button,a{font:inherit}
a{text-decoration:none}
.wrap{
  min-height:100vh;
  width:min(1180px,94vw);
  margin:auto;
  padding:28px 0;
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:24px;
  align-items:stretch;
}
.brand-panel,.chat-panel{
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(7,22,47,.14);
}
.brand-panel{
  position:relative;
  min-height:720px;
  padding:42px;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:
    radial-gradient(circle at 78% 20%,rgba(255,122,47,.25),transparent 28%),
    linear-gradient(145deg,#07162f,#0b3c82 62%,#0d63d8);
}
.brand-panel:after{
  content:"";
  position:absolute;
  right:-95px;
  bottom:-95px;
  width:340px;
  height:340px;
  border-radius:50%;
  border:1px solid #ffffff22;
  box-shadow:0 0 0 58px #ffffff0a,0 0 0 116px #ffffff08;
}
.logo{
  width:64px;height:64px;
  display:grid;place-items:center;
  border-radius:18px;
  font-size:39px;font-weight:900;font-style:italic;
  background:linear-gradient(145deg,var(--cyan),var(--blue) 62%,var(--gold));
}
.kicker{
  margin-top:28px;
  color:var(--gold);
  font-size:.82rem;
  font-weight:900;
  letter-spacing:.18em;
}
.brand-panel h1{
  margin:12px 0 16px;
  font-size:clamp(2.6rem,6vw,5.1rem);
  line-height:1.04;
}
.brand-panel p{
  max-width:560px;
  color:#e8f2ff;
  line-height:1.9;
}
.employee-card{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:16px;
  align-items:center;
  padding:18px;
  border:1px solid #ffffff2c;
  border-radius:22px;
  background:#ffffff12;
  backdrop-filter:blur(12px);
}
.avatar{
  width:66px;height:66px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:31px;
  color:var(--navy);
  background:linear-gradient(145deg,#fff,#d7ecff);
}
.employee-card strong{display:block;font-size:1.1rem}
.employee-card span{display:block;margin-top:4px;color:#bfe9ff;font-size:.9rem}
.chat-panel{
  min-height:720px;
  display:flex;
  flex-direction:column;
  background:#fff;
}
.chat-head{
  padding:20px 24px;
  color:#fff;
  background:var(--navy);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.chat-head-left{display:flex;align-items:center;gap:12px}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#51e58b;
  box-shadow:0 0 0 6px rgba(81,229,139,.13);
}
.chat-head small{display:block;color:#b7d8ff}
.head-actions{display:flex;gap:8px;align-items:center}
.reset,.home-mini{
  color:#fff;
  border:1px solid #ffffff42;
  border-radius:999px;
  padding:9px 13px;
  background:#ffffff10;
  cursor:pointer;
  font-weight:800;
}
.home-mini{display:inline-flex;align-items:center}
.chat-body{
  flex:1;
  padding:22px;
  overflow:auto;
  background:
    linear-gradient(rgba(245,248,253,.96),rgba(245,248,253,.96)),
    radial-gradient(circle,#0d63d815 1px,transparent 1px);
  background-size:auto,18px 18px;
}
.message{
  max-width:88%;
  margin:0 0 15px;
  padding:14px 16px;
  border-radius:18px;
  line-height:1.7;
  animation:pop .25s ease;
}
.bot{
  margin-right:auto;
  background:#fff;
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
  box-shadow:0 8px 22px rgba(7,22,47,.07);
}
.user{
  margin-left:auto;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),#0b4ca4);
  border-bottom-right-radius:6px;
}
.preview{
  margin-top:10px;
  padding:14px;
  border-radius:14px;
  background:#f0f6ff;
  border:1px solid var(--line);
  white-space:pre-wrap;
  line-height:1.75;
}
.typing{display:inline-flex;gap:5px;align-items:center}
.typing i{
  width:7px;height:7px;border-radius:50%;
  background:#7d8ba1;
  animation:bounce 1s infinite;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.quick-actions{
  padding:18px 22px 22px;
  border-top:1px solid #e9eef7;
  background:#fff;
}
.quick-actions p{
  margin:0 0 12px;
  color:#718098;
  font-size:.88rem;
}
.choices{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.choice{
  min-height:54px;
  padding:11px 13px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:15px;
  color:var(--navy);
  background:#f8fbff;
  cursor:pointer;
  font-weight:800;
  transition:.2s ease;
}
.choice:hover{
  transform:translateY(-2px);
  border-color:#0d63d866;
  background:#edf6ff;
}
.choice span{
  display:block;
  margin-top:3px;
  color:#6f7d93;
  font-size:.76rem;
  font-weight:600;
}
.notice{
  margin-top:14px;
  color:#8491a5;
  font-size:.78rem;
  line-height:1.5;
}
.footer-return{
  text-align:center;
  padding:4px 0 34px;
}
.home-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 28px;
  border-radius:999px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 10px 20px rgba(13,99,216,.25);
}
@keyframes pop{from{transform:translateY(5px);opacity:0}to{transform:none;opacity:1}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;padding:14px 0}
  .brand-panel{min-height:430px;padding:28px}
  .chat-panel{min-height:690px}
}
@media(max-width:540px){
  .choices{grid-template-columns:1fr}
  .brand-panel h1{font-size:3rem}
  .chat-head{align-items:flex-start}
  .head-actions{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="brand-panel">
    <div>
      <div class="logo">F</div>
      <div class="kicker">FORGEATION AI EMPLOYEE</div>
      <h1>未来を、<br>世の中へ伝える。</h1>
      <p>
        ForgeationのAI広報社員が、SNS投稿、イベント告知、
        プレスリリース、採用広報の文章づくりをサポートします。
      </p>
    </div>
    <div class="employee-card">
      <div class="avatar">📣</div>
      <div>
        <strong>AI広報社員 ジッピー</strong>
        <span>社員番号 AI-003／広報・ブランド戦略課</span>
      </div>
    </div>
  </section>

  <section class="chat-panel">
    <div class="chat-head">
      <div class="chat-head-left">
        <div class="status-dot"></div>
        <div>
          <strong>Forgeation 広報室</strong>
          <small>AI広報社員が対応中</small>
        </div>
      </div>
      <div class="head-actions">
        <a class="home-mini" href="index.html">🏠 戻る</a>
        <button class="reset" id="resetBtn">最初から</button>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="quick-actions">
      <p>作成したい広報内容を選択してください</p>
      <div class="choices" id="choices">
        <button class="choice" data-key="sns">SNS投稿を作る<span>短く、伝わる文章</span></button>
        <button class="choice" data-key="event">イベント告知<span>参加したくなる案内</span></button>
        <button class="choice" data-key="press">プレスリリース<span>正式な発表文</span></button>
        <button class="choice" data-key="recruit">採用広報<span>仲間を迎える文章</span></button>
        <button class="choice" data-key="academy">アカデミー紹介<span>魅力を分かりやすく発信</span></button>
        <button class="choice" data-key="brand">ブランドメッセージ<span>Forgeationらしい言葉</span></button>
      </div>
      <div class="notice">※これは動作確認用デモです。投稿・送信・外部サービス連携は行いません。</div>
    </div>
  </section>
</div>

<div class="footer-return">
  <a class="home-button" href="index.html">🏠 Forgeationホームページに戻る</a>
</div>

<script>
const chatBody=document.getElementById("chatBody");
const choices=document.getElementById("choices");
const resetBtn=document.getElementById("resetBtn");

const replies={
  sns:{
    user:"SNS投稿を作りたいです。",
    bot:"承知しました。Forgeationの理念が伝わるSNS投稿案を作成します。",
    result:"【SNS投稿案】\n未来は、待つものではない。共に創るもの。\nForgeationは、AIと人の力を掛け合わせ、学び・挑戦・成長が循環する未来の学校を創ります。\n\nDesign the Future. Forge the Future.\n#Forgeation #AI教育 #未来創造"
  },
  event:{
    user:"イベント告知を作りたいです。",
    bot:"参加者が内容をイメージしやすいイベント告知案を作成します。",
    result:"【イベント告知案】\nForgeation未来体験会を開催します。\nAI、スポーツ、看護・医療、建築、教育の未来を、見て・触れて・考える体験型イベントです。\n\n対象：未来の学びに関心のある方\n内容：AI社員デモ／アカデミー紹介／個別相談\n\n一緒に、未来への一歩を始めませんか。"
  },
  press:{
    user:"プレスリリースを作りたいです。",
    bot:"企業としての正式な発表文を想定した文章案を作成します。",
    result:"【プレスリリース案】\nForgeation、AIと人が共に学び成長する『未来型アカデミー構想』を発表\n\nForgeationは、AIを核として教育、スポーツ、看護・医療、建築、ロボティクスを横断する学習・事業構想を推進します。人に代わるAIではなく、人の可能性を支えるAIの社会実装を目指します。"
  },
  recruit:{
    user:"採用広報を作りたいです。",
    bot:"Forgeationの考え方に共感する仲間へ向けた文章案を作成します。",
    result:"【採用広報案】\n完成された会社に入るのではなく、未来の会社を一緒に創る。\nForgeationは、挑戦を恐れず、学び続け、人の可能性を信じる仲間を求めています。\n\n職種や経歴だけではなく、未来への意志を大切にします。\n共に学び、共に挑戦し、共に成長しませんか。"
  },
  academy:{
    user:"アカデミー紹介文を作りたいです。",
    bot:"複数のアカデミーを一つの世界観で紹介する文章案を作成します。",
    result:"【アカデミー紹介案】\nForgeationのアカデミーは、知識を覚えるだけの場所ではありません。\nAI・ロボティクス、スポーツ、看護・医療、建築、教育を通じて、学びを実社会の挑戦へつなげます。\n\n一人ひとりの可能性を、未来を動かす力へ。"
  },
  brand:{
    user:"ブランドメッセージを作りたいです。",
    bot:"Forgeationの理念と未来像を凝縮した文章案を作成します。",
    result:"【ブランドメッセージ案】\n未来への入り口、それがForgeation。\n\n私たちは、AIと人の力で、学び方、働き方、生き方を進化させます。\n会社は学校であり、学校は未来を創る企業である。\n\nDesign the Future. Forge the Future.\nセンスは、未来。"
  }
};

function addMessage(text,type,previewText=""){
  const div=document.createElement("div");
  div.className=`message ${type}`;
  div.textContent=text;
  if(previewText){
    const preview=document.createElement("div");
    preview.className="preview";
    preview.textContent=previewText;
    div.appendChild(preview);
  }
  chatBody.appendChild(div);
  chatBody.scrollTop=chatBody.scrollHeight;
}
function addTyping(){
  const div=document.createElement("div");
  div.className="message bot";
  div.id="typing";
  div.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  chatBody.appendChild(div);
  chatBody.scrollTop=chatBody.scrollHeight;
}
function showRestartChoice(){
  choices.innerHTML="";
  const btn=document.createElement("button");
  btn.className="choice";
  btn.textContent="別の広報文を作る";
  btn.addEventListener("click",resetDemo);
  choices.appendChild(btn);
}
function handleChoice(key){
  const item=replies[key];
  addMessage(item.user,"user");
  choices.innerHTML="";
  addTyping();
  setTimeout(()=>{
    document.getElementById("typing")?.remove();
    addMessage(item.bot,"bot",item.result);
    showRestartChoice();
  },700);
}
function bindChoices(){
  choices.querySelectorAll("[data-key]").forEach(btn=>{
    btn.addEventListener("click",()=>handleChoice(btn.dataset.key));
  });
}
function resetDemo(){
  chatBody.innerHTML="";
  choices.innerHTML=`
    <button class="choice" data-key="sns">SNS投稿を作る<span>短く、伝わる文章</span></button>
    <button class="choice" data-key="event">イベント告知<span>参加したくなる案内</span></button>
    <button class="choice" data-key="press">プレスリリース<span>正式な発表文</span></button>
    <button class="choice" data-key="recruit">採用広報<span>仲間を迎える文章</span></button>
    <button class="choice" data-key="academy">アカデミー紹介<span>魅力を分かりやすく発信</span></button>
    <button class="choice" data-key="brand">ブランドメッセージ<span>Forgeationらしい言葉</span></button>
  `;
  bindChoices();
  addMessage("こんにちは。ForgeationのAI広報社員ジッピーです。今日は、どんな情報を世の中へ届けますか？","bot");
}
resetBtn.addEventListener("click",resetDemo);
resetDemo();
</script>
</body>
</html>
