<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F Education β</title>
<style>
body{
 margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:linear-gradient(180deg,#0b2d57,#2c7fd1);
 color:#fff;
}
.app{max-width:430px;margin:auto;padding:18px}
.header{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;color:#0b2d57;
display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:26px}
.card{background:#fff;color:#123;border-radius:18px;padding:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.btn{
background:#143d69;border-radius:18px;padding:18px;text-align:center;
border:1px solid rgba(255,255,255,.2)
}
.btn b{display:block;margin-top:8px}
textarea{
width:100%;height:64px;border-radius:16px;border:0;
padding:14px;margin-top:18px;font-size:15px
}
.send{
margin-top:10px;width:100%;padding:14px;border:0;border-radius:16px;
background:#54d7ff;color:#082142;font-weight:bold;font-size:16px
}
small{color:#d9ecff}
</style>
</head>
<body>
<div class="app">

<div class="header">
<div class="logo">F</div>
<div>
<h2 style="margin:0">📚 F Education</h2>
<small>Forgeation 教育アカデミー</small>
</div>
</div>

<div class="card">
<h3>😊 ジッピー先生へようこそ！</h3>
<p>
授業づくり・SST・教材作成・児童支援・保護者対応まで、
教育現場をAIでサポートします。
</p>
</div>

<div class="grid">
<div class="btn">📝<b>授業づくり</b></div>
<div class="btn">📖<b>教材作成</b></div>
<div class="btn">🤝<b>SST支援</b></div>
<div class="btn">👨‍🏫<b>学級経営</b></div>
<div class="btn">👨‍👩‍👧<b>保護者対応</b></div>
<div class="btn">📊<b>支援記録</b></div>
</div>

<textarea placeholder="ジッピー先生へ相談してみよう…"></textarea>
<button class="send">AI教育社員に相談する</button>

<p style="text-align:center;margin-top:18px;">
F Education β ／ Forgeation Network School
</p>

</div>
</body>
</html>
