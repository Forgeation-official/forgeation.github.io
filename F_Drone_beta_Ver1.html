<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>F DRONE ∞ — REAL FPV CONTROLLER Ver12</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif;touch-action:none}
#app{position:relative;width:100%;height:100%;background:#020914}
#scene{position:absolute;inset:0;background:url("f_drone_singapore_fpv.webp") center 42%/cover no-repeat;transform:scale(1.04);transition:transform .08s linear,filter .2s ease}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,15,.04),rgba(0,5,15,.08) 62%,rgba(0,5,15,.32));pointer-events:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.brand,.telemetry{background:rgba(3,12,26,.78);border:1px solid rgba(90,220,255,.55);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);font-weight:800}
.telemetry{display:flex;gap:12px;font-size:12px}
.center{position:absolute;left:50%;top:7%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000;pointer-events:none}
.center h1{font-size:clamp(18px,3vw,34px);margin:0 0 5px;letter-spacing:2px}.center div{font-size:12px;letter-spacing:2px}
.cross{position:absolute;left:50%;top:42%;width:44px;height:44px;transform:translate(-50%,-50%);opacity:.8;pointer-events:none}
.cross:before,.cross:after{content:"";position:absolute;background:#dffaff}.cross:before{width:44px;height:1px;top:21px}.cross:after{height:44px;width:1px;left:21px}
.controller{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,94vw);height:clamp(150px,28vh,260px);background:linear-gradient(#252b32,#0d1117);border:2px solid #4b535e;border-radius:38px 38px 22px 22px;box-shadow:0 15px 45px #000c;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,42px);gap:12px}
.stick{width:clamp(105px,18vw,180px);height:clamp(105px,18vw,180px);border-radius:50%;background:radial-gradient(circle,#111 0 28%,#222 29% 52%,#080a0d 53% 100%);border:3px solid #555;position:relative;touch-action:none;box-shadow:inset 0 0 25px #000}
.knob{position:absolute;left:50%;top:50%;width:38%;height:38%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#777,#191919 48%,#050505);border:2px solid #777;box-shadow:0 5px 12px #000}
.mid{flex:1;text-align:center;min-width:120px}.mid b{display:block;font-size:clamp(16px,2.2vw,25px);margin-bottom:10px}.status{font-size:11px;opacity:.8;margin:5px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
button{border:1px solid #68727d;background:#171d24;color:#fff;border-radius:9px;padding:8px 5px;font-weight:800;font-size:11px}
button:active{transform:scale(.96);background:#16495d}#hover{color:#75ff96}#home{color:#ffd45c}
.help{position:absolute;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + clamp(150px,28vh,260px) + 8px);transform:translateX(-50%);background:#07111dcc;border:1px solid #4fdfff66;padding:6px 12px;border-radius:10px;font-size:11px;white-space:nowrap}
@media(max-width:600px){
 .telemetry{gap:6px;padding:7px;font-size:9px}.brand{padding:8px;font-size:12px}.center{top:13%}
 .controller{height:190px;padding:12px 14px;border-radius:28px 28px 18px 18px}
 .stick{width:112px;height:112px}.mid{min-width:90px}.buttons button{font-size:9px;padding:7px 3px}.help{bottom:205px;font-size:9px}
}
.forge-nav{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;z-index:99;display:flex;gap:7px}.forge-nav button{background:#07111ddd;border:1px solid #4fdfff66;color:#fff;border-radius:12px;padding:8px 11px;font-weight:900}
.stagebar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:7px}.stagebar button{min-width:42px;padding:6px 8px}.stagebar .stage-label{min-width:78px;font-size:11px;font-weight:900;letter-spacing:1px;color:#dffaff}.stage-list{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:120;width:min(560px,90vw);max-height:72vh;overflow:auto;background:#07111df2;border:1px solid #4fdfff88;border-radius:18px;padding:14px;box-shadow:0 18px 50px #000b;display:none}.stage-list.open{display:block}.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage-grid button{padding:10px 6px}.stage-grid button.active{border-color:#75ff96;box-shadow:0 0 0 1px #75ff96 inset}.stage-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.stage-list-head b{font-size:15px}.stage-close{padding:6px 10px!important}@media(max-width:600px){.stage-grid{grid-template-columns:repeat(3,1fr)}.stagebar .stage-label{min-width:68px;font-size:10px}}
</style>
</head>
<body><div class="forge-nav"><button onclick="forgeBack()">← 戻る</button><button onclick="location.href='index.html#f-series'">🏫 ホーム</button></div>
<div id="app">
 <div id="scene"></div><div id="shade"></div>
 <div class="top">
   <div class="brand">F DRONE ∞<br><small>AI ROBOTICS LAB</small></div>
   <div class="telemetry"><span id="gps">GPS ▮▮▮▮</span><span id="bat">BAT 98%</span><span id="alt">ALT 40m</span><span id="spd">SPD 0km/h</span></div>
 </div>
 <div class="center"><h1 id="sceneTitle">F DRONE STAGE 001</h1><div>LIVE FPV CAMERA</div></div>
 <div class="cross"></div>
 <div class="help">PC：← ↑ ↓ →　／　スマホ：左右スティックをドラッグ</div>
 <div class="stagebar" style="position:absolute;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + clamp(150px,28vh,260px) + 42px);transform:translateX(-50%);z-index:90;background:#07111dcc;border:1px solid #4fdfff66;padding:6px 8px;border-radius:12px;">
   <button id="stagePrev" type="button">◀</button>
   <button id="stageOpen" type="button" class="stage-label">STAGE <span id="stageLabel">001</span></button>
   <button id="stageNext" type="button">▶</button>
 </div>
 <div class="stage-list" id="stageList">
   <div class="stage-list-head"><b>F DRONE STAGE SELECT</b><button class="stage-close" id="stageClose" type="button">✕</button></div>
   <div class="stage-grid" id="stageGrid"></div>
 </div>
 <div class="controller">
   <div class="stick" id="leftStick"><div class="knob"></div></div>
   <div class="mid">
     <b>F DRONE ∞</b>
     <div class="status" id="status">LIVE FPV / HOVER</div>
     <div class="buttons"><button id="camera">CAMERA</button><button id="hover">HOVER</button><button id="home">RETURN</button></div>
   </div>
   <div class="stick" id="rightStick"><div class="knob"></div></div>
 </div>
</div>
<script>
function forgeBack(){
  if(document.referrer && document.referrer!==location.href){ history.back(); }
  else { location.href='index.html#f-series'; }
}

// ========================================
// Forgeation 8アプリ共通API送信（F DRONE）
// 正式Workerはこの1本に固定
// 利用記録は POST /app-usage に統一
// ========================================
const FORGEATION_API_BASE='https://forgeation-api.eru12121221.workers.dev';
const FORGE_PRODUCT='f-drone';
const FORGE_VERSION='beta-Ver1-stage100-auto';

function getForgeationVisitorId(){
  const key='forgeation_visitor_id';
  let id=localStorage.getItem(key) || localStorage.getItem('visitorId');
  if(!id){
    id=(crypto.randomUUID?.() || ('visitor-'+Date.now()+'-'+Math.random().toString(16).slice(2)));
  }
  localStorage.setItem(key,id);
  localStorage.setItem('visitorId',id);
  return id;
}

function getForgeationUserId(){
  return localStorage.getItem('forgeation_user_id') ||
         localStorage.getItem('user_id') || null;
}

async function sendAppUsage(action='open', extra={}){
  const visitorId=getForgeationVisitorId();
  const userId=getForgeationUserId();
  try{
    const res=await fetch(FORGEATION_API_BASE+'/app-usage',{
      method:'POST',
      mode:'cors',
      cache:'no-store',
      credentials:'omit',
      keepalive:true,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        app_id:FORGE_PRODUCT,
        appId:FORGE_PRODUCT,
        visitor_id:visitorId,
        visitorId:visitorId,
        user_id:userId,
        userId:userId,
        event:action,
        action:action,
        used_at:new Date().toISOString(),
        version:FORGE_VERSION,
        ...extra
      })
    });
    if(!res.ok) throw new Error('API '+res.status);
    return await res.json().catch(()=>({ok:true}));
  }catch(err){
    console.warn('F DRONE 共通API送信エラー:',err);
    return {ok:false,pending:true};
  }
}

const scene=document.getElementById('scene'), spd=document.getElementById('spd'), alt=document.getElementById('alt'), statusEl=document.getElementById('status');
let x=0,y=0,z=40,speed=0,yaw=0;
const STAGE_COUNT=31;
const MAX_STAGE=100;
// 001〜100のファイル名を自動生成。今後はPNGを追加するだけでHTMLの書き換え不要。
const STAGES=Array.from({length:MAX_STAGE},(_,i)=>`F_Drone_Stage_${String(i+1).padStart(3,'0')}.png`);
let currentStage=0;
const stageLabel=document.getElementById('stageLabel');
const sceneTitle=document.getElementById('sceneTitle');
const stageList=document.getElementById('stageList');
const stageGrid=document.getElementById('stageGrid');
function resetFlight(){x=0;y=0;z=40;speed=0;yaw=0;statusEl.textContent='LIVE FPV / HOVER';}
function loadStage(index, direction=1, checked=0){
  currentStage=(index+STAGE_COUNT)%STAGE_COUNT;
  const img=new Image();
  img.onload=()=>{
    scene.style.backgroundImage=`url("${STAGES[currentStage]}")`;
    stageLabel.textContent=String(currentStage+1).padStart(3,'0');
    sceneTitle.textContent=`F DRONE STAGE ${String(currentStage+1).padStart(3,'0')}`;
    sceneSub.textContent='LIVE FPV CAMERA';
    resetFlight();
    render();
    [...stageGrid.children].forEach((b,i)=>b.classList.toggle('active',i===currentStage));
    sendAppUsage('stage_select',{stage:currentStage+1,image:STAGES[currentStage]});
  };
  img.onerror=()=>{
    if(checked<STAGE_COUNT-1) loadStage(currentStage+direction,direction,checked+1);
  };
  img.src=STAGES[currentStage];
  return;
}
for(let i=0;i<STAGE_COUNT;i++){
  const b=document.createElement('button');
  b.textContent=String(i+1).padStart(3,'0');
  b.onclick=()=>{loadStage(i);stageList.classList.remove('open');};
  stageGrid.appendChild(b);
}
document.getElementById('stagePrev').onclick=()=>loadStage(currentStage-1,-1);
document.getElementById('stageNext').onclick=()=>loadStage(currentStage+1,1);
document.getElementById('stageOpen').onclick=()=>stageList.classList.add('open');
document.getElementById('stageClose').onclick=()=>stageList.classList.remove('open');
function render(){
  x=Math.max(-6,Math.min(6,x)); y=Math.max(-4,Math.min(4,y));
  scene.style.transform=`scale(1.10) translate(${x}%,${y}%) rotate(${yaw}deg)`;
  spd.textContent='SPD '+Math.round(Math.abs(speed))+'km/h';
  alt.textContent='ALT '+Math.round(z)+'m';
}
function move(dx,dy,ds=5){x+=dx;y+=dy;speed=ds;statusEl.textContent='LIVE FPV / FLYING';render()}
const keys={ArrowLeft:()=>move(1,0),ArrowRight:()=>move(-1,0),ArrowUp:()=>move(0,1),ArrowDown:()=>move(0,-1)};
addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();keys[e.key]();}});
addEventListener('keyup',e=>{if(keys[e.key]){speed=0;statusEl.textContent='LIVE FPV / HOVER';render();}});
function stick(el,type){
 const knob=el.querySelector('.knob'); let active=false;
 function upd(ev){
  if(!active)return; const p=ev, r=el.getBoundingClientRect();
  let dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=r.width*.28;
  let len=Math.hypot(dx,dy)||1;if(len>m){dx=dx/len*m;dy=dy/len*m}
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  if(type==='left'){x-=dx*.006;y-=dy*.006;speed=Math.min(25,Math.hypot(dx,dy)*.35)}
  else{yaw=dx*.025;z=Math.max(5,Math.min(120,z-dy*.015));}
  statusEl.textContent='LIVE FPV / FLYING';render();
 }
 function start(e){active=true;el.setPointerCapture?.(e.pointerId);upd(e)}
 function end(){active=false;knob.style.transform='translate(-50%,-50%)';speed=0;statusEl.textContent='LIVE FPV / HOVER';render()}
 el.addEventListener('pointerdown',start);el.addEventListener('pointermove',upd);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
stick(document.getElementById('leftStick'),'left');stick(document.getElementById('rightStick'),'right');
document.getElementById('hover').onclick=()=>{speed=0;y=0;yaw=0;statusEl.textContent='LIVE FPV / HOVER';render();sendAppUsage('hover',{stage:currentStage+1})};
document.getElementById('home').onclick=()=>{resetFlight();statusEl.textContent='RETURN HOME / READY';render();sendAppUsage('return_home',{stage:currentStage+1})};
document.getElementById('camera').onclick=()=>{scene.style.filter='brightness(1.18) saturate(1.08)';statusEl.textContent='PHOTO CAPTURED';sendAppUsage('camera',{stage:currentStage+1});setTimeout(()=>scene.style.filter='',250)};
sendAppUsage('open');
loadStage(0);
</script>
</body>
</html>
