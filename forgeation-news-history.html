<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORGEATION NEWS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#041a39;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh}
.board{width:min(1500px,100%);margin:auto;background:linear-gradient(180deg,#062f68,#041a39);box-shadow:0 0 60px #0008}
.hero{background:#061a39}
.hero img{display:block;width:100%;height:auto}
.history{padding:24px 14px 34px;background:linear-gradient(180deg,#041a39,#062a58)}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 8px 14px}
.history-head h2{margin:0;font-size:clamp(22px,3vw,38px);color:#66aaff;letter-spacing:.03em}
.history-head h2 span{color:#f4c85a;font-size:.65em}
.history-head p{margin:0;color:#9dbbd8;font-weight:700}
.orbit{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;touch-action:pan-x;-webkit-overflow-scrolling:touch;padding:12px max(calc(50% - 160px),10px) 28px;scrollbar-width:thin}
.card{flex:0 0 320px;min-height:300px;scroll-snap-align:center;border:1px solid #3471ad;border-radius:16px;background:linear-gradient(160deg,#0c3768,#08254a);padding:18px;position:relative;box-shadow:0 12px 30px #0005;transition:.2s}
.card.active{border-color:#f4c85a;transform:scale(1.03);box-shadow:0 0 0 2px #f4c85a33,0 18px 35px #0006}
.date{font-weight:900;color:#9bcaff}
.icon{font-size:46px;margin:15px 0 8px}
.card h3{font-size:21px;margin:5px 0 10px}
.card p{font-size:14px;line-height:1.75;color:#b7cde2}
.card button{position:absolute;left:16px;right:16px;bottom:16px;border:1px solid #f4c85a;border-radius:999px;padding:10px;background:transparent;color:#f4c85a;font-weight:900}
.detail{margin:0 8px;padding:20px;border-radius:16px;background:#03152d;border:1px solid #285b8c}
.detail b{color:#f4c85a}.detail h3{font-size:25px;margin:7px 0}.detail p{color:#b9cee2;line-height:1.8;margin-bottom:0}
.note{text-align:center;color:#9dbbd8;padding:13px 5px 0;font-size:13px}
@media(max-width:600px){.history-head{display:block}.history-head p{margin-top:8px}.card{flex-basis:84vw}}

/* ===== 社長ダッシュボードへ戻るボタン ===== */
.dashboard-back-wrap{
  position:fixed;
  top:max(14px, env(safe-area-inset-top));
  right:14px;
  z-index:99999;
}
.dashboard-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:10px 16px;
  border:1px solid rgba(145,211,255,.72);
  border-radius:999px;
  color:#fff;
  background:rgba(3,22,48,.88);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  text-decoration:none;
  font-weight:900;
  font-size:14px;
  touch-action:manipulation;
}
.dashboard-back:hover,
.dashboard-back:focus-visible{
  background:#0b3f78;
  outline:2px solid #8fd6ff;
  outline-offset:3px;
}
.dashboard-back:active{transform:scale(.98)}
@media(max-width:600px){
  .dashboard-back{
    min-height:42px;
    padding:9px 12px;
    font-size:12px;
  }
}

</style>
</head>

<script>
const history=[
["2026.07.03","🤝","ノグとジッピー、出逢う","二人三脚の対話が始まる。"],
["2026.07.05","🏫","Forgeation構想","会社＝学校＝企業という未来像へ。"],
["2026.07.07","🧭🔥","ブランド形成期","羅針盤、Phoenixなどを検討しながら、Forgeationの顔を探した。"],
["2026.07.16","🎓","AIを学び、会社へ","学びを会社づくりへ還元。"],
["2026.07.24","🌐","公式ホームページへ","構想を社会から見える形へ。"],
["2026.07.28","🤖","AI受付社員","1階フロントへつながるAI受付社員のデモ。"],
["2026.07.29","⚽","AIコーチ","スポーツ×AIの製品構想が動き始める。"],
["2026.07.31","🏫","アカデミー拡大","複数のアカデミーがForgeation Schoolとして形になる。"],
["2026.08.02","🚀","API会話成功","AIサッカーコーチのAPI会話が成功。製品化へ大きく前進。"],
["2026.08.06","☁️","Forgeation Cloud","データでつながる学校・会社の構想へ。"],
["2026.08.09","📊","学校のにぎわい","仮数字ではなく実測値で学校の今を伝える構想へ。"]
];
const orbit=document.getElementById("orbit"),detail=document.getElementById("detail");
function show(i){
 document.querySelectorAll(".card").forEach((e,n)=>e.classList.toggle("active",n===i));
 const h=history[i];
 detail.innerHTML=`<b>${h[0]}</b><h3>${h[1]} ${h[2]}</h3><p>${h[3]}</p>`;
}
history.forEach((h,i)=>{
 const e=document.createElement("article");
 e.className="card";
 e.innerHTML=`<div class="date">${h[0]}</div><div class="icon">${h[1]}</div><h3>${h[2]}</h3><p>${h[3]}</p><button type="button">この出来事の詳細を見る</button>`;
 e.querySelector("button").onclick=()=>{show(i);e.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})};
 orbit.appendChild(e);
});
show(history.length-1);
orbit.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();orbit.scrollLeft+=e.deltaY}},{passive:false});
</script>
