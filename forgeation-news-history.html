<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORGEATION NEWS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#041a39;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh}
.board{width:min(1500px,100%);margin:auto;background:linear-gradient(180deg,#062f68,#041a39);box-shadow:0 0 60px #0008}
.news-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:22px 26px;background:linear-gradient(90deg,#04152e,#082d60);border-bottom:1px solid #ffffff1f}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:1000;font-style:italic;font-size:32px;background:linear-gradient(145deg,#24c8ff,#2675ed 64%,#ff7c2a);box-shadow:0 0 28px #21a9ff44}
.logo-copy b{display:block;font-size:21px} .logo-copy small{color:#a9c7e4;font-weight:800;letter-spacing:.08em}
.news-title{font-size:clamp(28px,4vw,52px);font-weight:1000;letter-spacing:.04em;text-align:center}
.clock{text-align:right;font-weight:900} .clock .time{font-size:25px} .clock .date{color:#b9d3e9;font-size:13px;margin-top:4px}
.hero{background:#061a39;padding:0 12px 14px}
.hero img{display:block;width:100%;height:auto;border-radius:0 0 22px 22px}
.history{padding:26px 14px 38px;background:linear-gradient(180deg,#041a39,#062a58)}
.history-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 8px 14px}
.history-head h2{margin:0;font-size:clamp(24px,3vw,40px);color:#66aaff;letter-spacing:.03em}
.history-head h2 span{color:#f4c85a;font-size:.62em}
.history-head p{margin:0;color:#b4cee7;font-weight:800}
.controls{display:flex;gap:8px;justify-content:flex-end;margin:0 8px 10px}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid #67bfff;background:#072a55;color:#fff;font-size:22px;font-weight:1000;cursor:pointer}
.orbit{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;touch-action:pan-x;-webkit-overflow-scrolling:touch;padding:12px max(calc(50% - 165px),10px) 28px;scrollbar-width:thin;cursor:grab;user-select:none}
.orbit.dragging{cursor:grabbing;scroll-snap-type:none}
.card{flex:0 0 330px;min-height:310px;scroll-snap-align:center;border:1px solid #3471ad;border-radius:18px;background:linear-gradient(160deg,#0c3768,#08254a);padding:19px;position:relative;box-shadow:0 12px 30px #0005;transition:.2s}
.card.active{border-color:#f4c85a;transform:scale(1.035);box-shadow:0 0 0 2px #f4c85a33,0 18px 35px #0006}
.date-chip{display:inline-block;padding:6px 9px;border-radius:999px;background:#0d4a85;color:#bce2ff;font-size:12px;font-weight:950}
.icon{font-size:48px;margin:17px 0 8px}
.card h3{font-size:22px;margin:5px 0 10px}
.card p{font-size:14px;line-height:1.75;color:#c1d6e9}
.card button{position:absolute;left:16px;right:16px;bottom:16px;border:1px solid #f4c85a;border-radius:999px;padding:11px;background:#f4c85a10;color:#ffe08a;font-weight:950;cursor:pointer}
.card button:hover{background:#f4c85a24}
.live-detail{margin:0 8px;padding:22px;border-radius:18px;background:linear-gradient(145deg,#03152d,#082b53);border:1px solid #356d9f;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.live-detail .bigicon{font-size:52px} .live-detail b{color:#f4c85a} .live-detail h3{font-size:25px;margin:5px 0} .live-detail p{color:#c2d6e8;line-height:1.8;margin:0}
.note{text-align:center;color:#9dbbd8;padding:13px 5px 0;font-size:13px}
.dashboard-back-wrap{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:99999}
.dashboard-back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid rgba(145,211,255,.72);border-radius:999px;color:#fff;background:rgba(3,22,48,.9);box-shadow:0 10px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px);text-decoration:none;font-weight:900;font-size:14px}
.modal{position:fixed;inset:0;z-index:100000;background:#020916e8;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.magazine{width:min(900px,96vw);max-height:88vh;overflow:auto;border-radius:26px;background:linear-gradient(155deg,#f7f4ec,#e9f2fb);color:#09203d;box-shadow:0 30px 90px #000a;position:relative}
.mag-top{padding:22px 26px;background:linear-gradient(90deg,#062a58,#0b5398);color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center}
.mag-label{font-size:12px;font-weight:1000;letter-spacing:.14em;color:#ffd96a}
.mag-body{padding:30px 34px 36px}
.mag-date{font-weight:950;color:#27659e} .mag-icon{font-size:64px;margin:12px 0}
.mag-body h2{font-size:clamp(28px,5vw,48px);line-height:1.15;margin:6px 0 18px}
.mag-body p{font-size:17px;line-height:1.95;margin:0;color:#294762}
.mag-close{border:1px solid #ffffff77;background:#ffffff14;color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}
.mag-footer{margin-top:26px;padding-top:18px;border-top:1px solid #afc7da;font-weight:900;color:#0d4b82}
@media(max-width:700px){
 .news-header{grid-template-columns:1fr auto;padding:16px} .news-title{grid-column:1/-1;grid-row:2} .clock{font-size:12px}
 .history-head{display:block} .history-head p{margin-top:7px} .card{flex-basis:84vw}
 .live-detail{grid-template-columns:1fr} .mag-body{padding:24px 22px 30px}
 .dashboard-back{font-size:12px;padding:9px 12px}
}
</style>
</head>

history.forEach((h,i)=>{
 const e=document.createElement("article"); e.className="card";
 e.innerHTML=`<div class="date-chip">${h[0]}</div><div class="icon">${h[1]}</div><h3>${h[2]}</h3><p>${h[3]}</p><button type="button">この出来事の詳細を見る</button>`;
 e.addEventListener("click",()=>renderDetail(i));
 e.querySelector("button").addEventListener("click",(ev)=>{ev.stopPropagation();renderDetail(i);openMagazine(i)});
 orbit.appendChild(e);
});
renderDetail(current);

function move(dir){
 current=Math.max(0,Math.min(history.length-1,current+dir));
 const card=orbit.children[current]; renderDetail(current);
 card.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
document.getElementById("prevBtn").onclick=()=>move(-1);
document.getElementById("nextBtn").onclick=()=>move(1);

orbit.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();orbit.scrollLeft+=e.deltaY;}},{passive:false});
let down=false,startX=0,startLeft=0;
orbit.addEventListener("pointerdown",e=>{down=true;startX=e.clientX;startLeft=orbit.scrollLeft;orbit.classList.add("dragging");orbit.setPointerCapture(e.pointerId)});
orbit.addEventListener("pointermove",e=>{if(down) orbit.scrollLeft=startLeft-(e.clientX-startX)});
orbit.addEventListener("pointerup",()=>{down=false;orbit.classList.remove("dragging")});
orbit.addEventListener("pointercancel",()=>{down=false;orbit.classList.remove("dragging")});
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});

document.getElementById("closeModal").onclick=()=>{modal.classList.remove("show");document.body.style.overflow=""};
modal.addEventListener("click",e=>{if(e.target===modal)document.getElementById("closeModal").click()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("show"))document.getElementById("closeModal").click()});

function updateClock(){
 const d=new Date();
 document.getElementById("nowTime").textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("nowDate").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
}
updateClock();setInterval(updateClock,30000);
</script>
</body>
</html>
