<script>
/* ========================================
学校のにぎわい速報：公開DB集計API連動
スポーツアカデミー課／サッカーアカデミー課対応
======================================== */

const FORGEATION_PUBLIC_API_BASE =
"https://forgeation-api.eru12121221.workers.dev";

function setAcademyStat(key, value){
const num = document.getElementById(`stat-${key}`);
const note = document.getElementById(`note-${key}`);

if(!num || !note) return;

if(Number.isFinite(Number(value))){
num.textContent = `${Number(value)}人`;
note.textContent = "DB実測値";
}else{
num.textContent = "—";
note.textContent = "未接続";
}
}

function normalizeKey(value){
return String(value ?? "")
.toLowerCase()
.replace(/[\s_\-・]/g,"");
}

function pickStat(data, names){

if(!data) return null;

/* オブジェクト形式 */
if(!Array.isArray(data) && typeof data === "object"){

for(const name of names){
if(data[name] !== undefined && data[name] !== null){
return data[name];
}
}

const normalizedNames = names.map(normalizeKey);

for(const [key,value] of Object.entries(data)){
if(normalizedNames.includes(normalizeKey(key))){
if(
value &&
typeof value === "object" &&
value.count !== undefined
){
return value.count;
}
return value;
}
}
}

/* 配列形式 */
if(Array.isArray(data)){

const normalizedNames = names.map(normalizeKey);

for(const row of data){

if(!row || typeof row !== "object") continue;

const candidate =
row.key ??
row.name ??
row.academy ??
row.academy_name ??
row.page ??
row.app ??
row.slug ??
row.id;

if(
candidate !== undefined &&
normalizedNames.includes(normalizeKey(candidate))
){
return (
row.count ??
row.users ??
row.total ??
row.value ??
row.visits ??
null
);
}
}
}

return null;
}

async function loadAcademyStats(){

const status =
document.getElementById("academyStatsStatus");

const keys = [
"f-soccer",
"soccer-academy",
"sports-academy",
"construction",
"ai",
"education",
"robotics",
"medical",
"care",
"total"
];

try{

if(status){
status.textContent = "DB接続中…";
}

const res = await fetch(
`${FORGEATION_PUBLIC_API_BASE}/academy-stats`,
{
method:"GET",
headers:{
"Accept":"application/json"
},
cache:"no-store"
}
);

if(!res.ok){
throw new Error(`HTTP ${res.status}`);
}

const data = await res.json();

const source =
(data && data.academies)
? data.academies
: data;

/* F Soccer */
const fs = pickStat(source,[
"fSoccer",
"f_soccer",
"f-soccer",
"fsoccer"
]);

/* サッカーアカデミー課 */
const soccerAcademy = pickStat(source,[
"soccerAcademy",
"soccer_academy",
"soccer-academy",
"academySoccer",
"academy_soccer",
"academy-soccer",
"サッカーアカデミー課",
"サッカーアカデミー"
]);

/* スポーツアカデミー課 */
const sportsAcademy = pickStat(source,[
"sportsAcademy",
"sports_academy",
"sports-academy",
"academySports",
"academy_sports",
"academy-sports",
"sports",
"sport",
"スポーツアカデミー課",
"スポーツアカデミー"
]);

const construction = pickStat(source,[
"construction",
"building",
"kensetsu"
]);

const ai = pickStat(source,[
"ai"
]);

const education = pickStat(source,[
"education",
"edu"
]);

const robotics = pickStat(source,[
"robotics",
"aiRobotics",
"ai_robotics"
]);

const medical = pickStat(source,[
"medical",
"nursing",
"nursingMedical"
]);

const care = pickStat(source,[
"care",
"welfare",
"careWelfare"
]);

setAcademyStat("f-soccer",fs);

setAcademyStat(
"soccer-academy",
soccerAcademy
);

setAcademyStat(
"sports-academy",
sportsAcademy
);

setAcademyStat(
"construction",
construction
);

setAcademyStat("ai",ai);

setAcademyStat(
"education",
education
);

setAcademyStat(
"robotics",
robotics
);

setAcademyStat(
"medical",
medical
);

setAcademyStat(
"care",
care
);

let total = pickStat(source,[
"total",
"all",
"sum"
]);

if(total === null){

const vals = [
fs,
soccerAcademy,
sportsAcademy,
construction,
ai,
education,
robotics,
medical,
care
]
.map(Number)
.filter(Number.isFinite);

total =
vals.length === 9
? vals.reduce((a,b)=>a+b,0)
: null;
}

setAcademyStat("total",total);

if(status){
status.textContent = "DB実測値";
}

}catch(err){

console.warn(
"Forgeation academy stats fetch failed:",
err
);

if(status){
status.textContent = "DB未接続";
}

keys.forEach(
key => setAcademyStat(key,null)
);
}
}

/* 初回取得 */
loadAcademyStats();

/* 15秒ごとに最新値へ更新 */
setInterval(
loadAcademyStats,
15000
);
</script>
