<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111d"><title>FORGEATION · INFINITE LIBRARY | CINEMA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c;color:white;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,a{font:inherit}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#070d14}#stage:active{cursor:grabbing}.scene{position:absolute;inset:-12%;background-size:cover;background-position:center;transform:translate3d(0,0,0) scale(1.04);opacity:0;transition:opacity 1.1s ease;will-change:transform}.scene.active{opacity:1}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0009 0%,transparent 30%,transparent 55%,#000a 100%);pointer-events:none}.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px 25px #03040b6e}header{position:fixed;z-index:3;top:0;left:0;right:0;padding:max(20px,env(safe-area-inset-top)) 20px 16px;display:flex;justify-content:space-between;align-items:start;gap:10px;text-shadow:0 2px 12px #000}header strong{font-size:clamp(14px,2.6vw,21px);letter-spacing:.11em}header small{display:block;color:#a6e5ff;letter-spacing:.1em;margin-top:8px;font-size:11px;font-weight:700}button,.exit{color:#fff;border:1px solid #a1e8ff99;background:#06192dcc;border-radius:15px;padding:13px 15px;min-height:46px;font-weight:800;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}button:focus-visible,.exit:focus-visible{outline:3px solid #fff}footer{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:22px 16px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#03070ce8);text-align:center}.title{font-size:clamp(21px,5vw,31px);font-weight:900;text-shadow:0 3px 12px #000}.subtitle{font-size:13px;color:#d9f0ff;margin:7px 0 16px;line-height:1.5}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:780px;margin:auto}.buttons button{font-size:13px}.primary{background:linear-gradient(120deg,#c7f6ff,#ffdfa3);color:#071524;border:0}.badge{position:fixed;z-index:2;top:112px;left:16px;background:#06192dbb;padding:9px 13px;border-radius:12px;font-size:11px;color:#e5f7ff;max-width:calc(100% - 32px)}#help{position:fixed;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);background:#041424ee;border:1px solid #8ddfff88;border-radius:18px;padding:24px;max-width:min(390px,90vw);line-height:1.8;display:none;box-shadow:0 16px 70px #000b}#help.show{display:block}#help button{display:block;margin:16px auto 0}@media(max-height:660px){.badge{display:none}footer{padding-top:12px}.subtitle{margin:4px 0 8px}.buttons button{min-height:40px;padding:9px}}@media(prefers-reduced-motion:reduce){.scene{transition:none}}
</style></head><body><main id="stage" aria-label="映画風の図書館ビュー。指で上下左右に景色を動かせます"><div class="scene active" style="background-image:url('forgeation-library-celestial.webp')"></div><div class="scene" style="background-image:url('forgeation-library-skygarden.webp')"></div><div class="vignette"></div></main><header><div><strong>✦ FORGEATION · INFINITE LIBRARY</strong><small>DESIGN THE FUTURE. FORGE THE FUTURE.</small></div><a class="exit" href="index.html">× 出る</a></header><div class="badge">🎬 オリジナル映画風ビュー · 画像内の視点移動（※全天球360°ではありません）</div><footer><div class="title" id="title">✦ 星の書架 · 中央ホール</div><div class="subtitle" id="sub">ガラス天蓋と光の書架。画面を指で動かして、空間を眺めよう。</div><div class="buttons"><button id="left">◀ 左を見る</button><button id="up">▲ 天井</button><button id="down">▼ 床</button><button id="right">右を見る ▶</button><button class="primary" id="next">奥へ進む ↗</button><button id="info">操作案内</button></div></footer><div id="help" role="dialog" aria-modal="true"><strong>FORGEATION CINEMA VIEW</strong><br>指でスワイプすると、映画風の高精細な画像の中で視点が動きます。「奥へ進む」で別のホールへ切り替わります。<br><br>※この映像は平面画像を使ったシネマ体験版です。完全な上下左右360°の全天球パノラマではありません。<button id="close">閉じる</button></div><script>
(()=>{'use strict';const stage=document.getElementById('stage'),scenes=[...document.querySelectorAll('.scene')],titles=['✦ 星の書架 · 中央ホール','✦ 天空庭園 · 光の図書館'],subs=['ガラス天蓋と光の書架。画面を指で動かして、空間を眺めよう。','空へ続く曲線回廊と、緑に包まれた未来の閲覧室。'];let index=0,x=0,y=0,down=false,lastX=0,lastY=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){scenes.forEach(s=>s.style.transform=`translate3d(${x}%,${y}%,0) scale(1.08)`)}function move(dx,dy){x=clamp(x+dx,-8,8);y=clamp(y+dy,-10,10);draw()}stage.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!down)return;move((e.clientX-lastX)/innerWidth*18,(e.clientY-lastY)/innerHeight*18);lastX=e.clientX;lastY=e.clientY});stage.addEventListener('pointerup',()=>down=false);stage.addEventListener('pointercancel',()=>down=false);for(const [id,dx,dy] of [['left',2,0],['right',-2,0],['up',0,3],['down',0,-3]])document.getElementById(id).addEventListener('click',()=>move(dx,dy));document.getElementById('next').addEventListener('click',()=>{index=1-index;x=y=0;scenes.forEach((s,i)=>s.classList.toggle('active',i===index));document.getElementById('title').textContent=titles[index];document.getElementById('sub').textContent=subs[index];document.getElementById('next').textContent=index?'中央ホールへ戻る ↶':'奥へ進む ↗';draw()});document.getElementById('info').onclick=()=>document.getElementById('help').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('help').classList.remove('show');draw()})();
</script></body></html>
