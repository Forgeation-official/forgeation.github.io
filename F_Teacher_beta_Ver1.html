<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F Teacher | Forgeation</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050505,#3b1900);color:#fff;font-family:-apple-system,"Noto Sans JP",sans-serif}main{max-width:440px;margin:auto;padding:15px 15px 30px}.hero{border-radius:22px;overflow:hidden;border:1px solid #ff8500}.hero img{width:100%;display:block}h1{font-size:32px;margin:18px 0 4px}.tag{color:#ff9a24;font-size:18px;font-weight:900}.intro{line-height:1.7;color:#ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px 7px;margin:22px 0}.m{border:0;background:none;color:#fff}.m i{width:91px;height:91px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:34px;font-style:normal;background:radial-gradient(circle,#ff8500,#111 72%);border:2px solid #ff8500}.m b{display:block;font-size:12px;margin-top:7px}.card{padding:16px;border-radius:20px;border:1px solid #ff850088;background:#0009}.bar{height:9px;background:#ffffff22;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ff8500}.a{width:100%;padding:12px;margin-top:9px;border-radius:13px;border:1px solid #ff8500;background:#ff850022;color:#fff;font-weight:800}#fb{margin-top:10px;color:#ffb65f}</style></head><body><main><div class="hero"><img src="f-teacher-main.webp" alt="F Teacher"></div><h1>F Teacher</h1><div class="tag">未来をつくる先生が、ここから育つ。</div><p class="intro">FTN — Future Teacher Network。AIとともに学び続け、子どもの可能性を信じ、未来をつくる力を育てる先生へ。</p><section class="grid"><button class="m"><i>🧑‍🏫</i><b>授業づくり</b></button><button class="m"><i>💬</i><b>声かけ練習</b></button><button class="m"><i>🧩</i><b>ケース判断</b></button><button class="m"><i>📚</i><b>教材づくり</b></button><button class="m"><i>🤖</i><b>AI相談室</b></button><button class="m"><i>📈</i><b>成長記録</b></button></section><section class="card"><b>🏆 F Teacher Challenge　<span id="xp">0 XP</span></b><div class="bar"><i id="fill"></i></div><p>子どもが「分からない」と手を止めた。最初にどうする？</p><button class="a" data-n="20">まず子どもの考えを聞く</button><button class="a" data-n="15">ヒントを一つ出す</button><button class="a" data-n="5">すぐ正解を説明する</button><div id="fb">選択するとXPが反映されます。</div></section></main><script>let x=+localStorage.FTeacherXP||0;function r(){xp.textContent=x+' XP';fill.style.width=(x%100)+'%'}r();document.querySelectorAll('.a').forEach(b=>b.onclick=()=>{x+=+b.dataset.n;localStorage.FTeacherXP=x;r();fb.textContent=b.textContent+' ＋'+b.dataset.n+' XP'});</script></body></html>
