const names=["TOKYO NIGHT ARENA","LONDON SKY STADIUM","MADRID GRAND ARENA","MILAN BLUE STADIUM","RIO OCEAN STADIUM","BUENOS AIRES NIGHT GROUND","WORLD ARENA ∞"];

function start(){
 intro.style.display='none'; loading.style.display='grid';
 init3D(); loading.style.display='none'; game.style.display='block'; hud.style.display='block'; animate();
}
document.getElementById('takeoff').onclick=start;

function init3D(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x020814); scene.fog=new THREE.FogExp2(0x061322,.006);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
 game.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0x9fdcff,0x081018,1.5));
 const moon=new THREE.DirectionalLight(0xdcecff,2.5);moon.position.set(-40,70,25);moon.castShadow=true;scene.add(moon);
 const blue=new THREE.PointLight(0x20bfff,90,160);blue.position.set(0,24,0);scene.add(blue);

 buildStadium(); buildDrone();
 drone.position.set(0,8,45); camera.position.set(0,13,58);
 addEventListener('resize',resize);
 setupStick('leftStick',L); setupStick('rightStick',R);
}

function buildStadium(){
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x071018,roughness:.9}));
 floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

 // Pitch
 const pitch=new THREE.Mesh(new THREE.PlaneGeometry(68,105),new THREE.MeshStandardMaterial({color:0x17643b,roughness:.82}));
 pitch.rotation.x=-Math.PI/2; pitch.position.y=.03; pitch.receiveShadow=true;scene.add(pitch);
 const lineMat=new THREE.LineBasicMaterial({color:0xeaf7ef});
 const rectPts=[[-34,-52.5],[34,-52.5],[34,52.5],[-34,52.5],[-34,-52.5]].map(([x,z])=>new THREE.Vector3(x,.07,z));
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rectPts),lineMat));
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-34,.07,0),new THREE.Vector3(34,.07,0)]),lineMat));
 const circle=new THREE.EllipseCurve(0,0,9.15,9.15,0,Math.PI*2).getPoints(64).map(p=>new THREE.Vector3(p.x,.07,p.y));
 scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(circle),lineMat));

 // Tiered elliptical stands
 for(let tier=0;tier<5;tier++){
   const outerX=55+tier*6, outerZ=78+tier*6, y=2+tier*4.2;
   const shape=new THREE.Shape();
   shape.absellipse(0,0,outerX,outerZ,0,Math.PI*2,false,0);
   const hole=new THREE.Path(); hole.absellipse(0,0,43,63,0,Math.PI*2,true,0); shape.holes.push(hole);
   const geo=new THREE.ExtrudeGeometry(shape,{depth:3,bevelEnabled:false,curveSegments:80});
   geo.rotateX(Math.PI/2); geo.translate(0,y,0);
   const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:tier%2?0x152231:0x1d2d3e,metalness:.25,roughness:.72}));
   m.castShadow=true;m.receiveShadow=true;scene.add(m);
 }

 // Roof ring
 const roof=new THREE.Mesh(new THREE.TorusGeometry(82,2.5,10,96),new THREE.MeshStandardMaterial({color:0x172433,metalness:.75,roughness:.28}));
 roof.rotation.x=Math.PI/2;roof.scale.z=1.35;roof.position.y=23;scene.add(roof);

 // Floodlights
 for(let i=0;i<24;i++){
   const a=i/24*Math.PI*2, px=Math.cos(a)*72,pz=Math.sin(a)*92;
   const lamp=new THREE.PointLight(i%3===0?0x63dfff:0xffffff,18,65,2);
   lamp.position.set(px,25,pz);scene.add(lamp);
   const bulb=new THREE.Mesh(new THREE.SphereGeometry(.7,8,8),new THREE.MeshBasicMaterial({color:i%3===0?0x55dfff:0xffffff}));
   bulb.position.copy(lamp.position);scene.add(bulb);
 }

 // City skyline
 for(let i=0;i<90;i++){
   const a=Math.random()*Math.PI*2,r=125+Math.random()*70,h=10+Math.random()*65;
   const b=new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*12,h,5+Math.random()*12),
      new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.56,.25,.10+Math.random()*.12),roughness:.75,metalness:.25}));
   b.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);scene.add(b);
   if(i%2===0){const w=new THREE.PointLight(0x4dcfff,2,18);w.position.set(b.position.x,h*.65,b.position.z);scene.add(w)}
 }
}

function buildDrone(){
 drone=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:0x080b0f,metalness:.75,roughness:.22});
 const accent=new THREE.MeshStandardMaterial({color:0x18cfff,emissive:0x087799,emissiveIntensity:2});
 const body=new THREE.Mesh(new THREE.BoxGeometry(6.2,1.5,8.5),bodyMat);body.scale.set(1,.75,1);body.castShadow=true;drone.add(body);
 const nose=new THREE.Mesh(new THREE.SphereGeometry(2.4,24,16,0,Math.PI*2,0,Math.PI*.55),bodyMat);nose.rotation.x=Math.PI/2;nose.position.z=-3.5;drone.add(nose);
 const cam=new THREE.Mesh(new THREE.SphereGeometry(1.05,20,14),new THREE.MeshStandardMaterial({color:0x101820,metalness:.7,roughness:.15}));
 cam.position.set(0,-1.15,-4.1);drone.add(cam);
 const lens=new THREE.Mesh(new THREE.CircleGeometry(.52,20),new THREE.MeshStandardMaterial({color:0x07131a,metalness:.9,roughness:.05}));
 lens.position.set(0,-1.15,-5.05);drone.add(lens);
 for(const sx of [-1,1]) for(const sz of [-1,1]){
   const arm=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,6.7,12),bodyMat);
   arm.rotation.z=Math.PI/2;arm.rotation.y=(sz>0?-.55:.55)*sx;arm.position.set(sx*3.2,0,sz*2.2);drone.add(arm);
   const rotor=new THREE.Mesh(new THREE.CylinderGeometry(.55,.65,.6,16),bodyMat);rotor.position.set(sx*6.1,.15,sz*4.0);drone.add(rotor);
   const prop=new THREE.Mesh(new THREE.BoxGeometry(6,.06,.42),new THREE.MeshStandardMaterial({color:0x252d35,metalness:.7,roughness:.3,transparent:true,opacity:.72}));
   prop.position.set(sx*6.1,.55,sz*4.0); prop.userData.prop=true;drone.add(prop);
 }
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(3.5,.16,.5),accent);stripe.position.set(0,-.65,-3.8);drone.add(stripe);
 const logoCanvas=document.createElement('canvas');logoCanvas.width=256;logoCanvas.height=128;const c=logoCanvas.getContext('2d');c.fillStyle='#0879d8';c.roundRect(58,8,140,112,28);c.fill();c.fillStyle='white';c.font='900 italic 78px Arial';c.textAlign='center';c.fillText('F',128,91);
 const logo=new THREE.Mesh(new THREE.PlaneGeometry(2.7,1.35),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(logoCanvas),transparent:true}));
 logo.rotation.x=-Math.PI/2;logo.position.set(0,.62,-.4);drone.add(logo);
 scene.add(drone);
}

function setupStick(id,state){
 const el=document.getElementById(id),knob=el.querySelector('.knob');
 const reset=()=>{state.x=state.y=0;knob.style.transform='translate(0,0)'};
 el.onpointerdown=el.onpointermove=e=>{
   if(e.type==='pointermove'&&!el.hasPointerCapture(e.pointerId))return;
   el.setPointerCapture(e.pointerId); const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
   let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}
   state.x=dx/max;state.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
 };
 el.onpointerup=el.onpointercancel=reset;
}
document.getElementById('next').onclick=()=>{stage++;document.getElementById('stage').textContent=stage;document.getElementById('stadiumName').textContent=names[(stage-1)%names.length];scene.background=new THREE.Color().setHSL((.59+stage*.037)%1,.55,.07)};

function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function animate(){
 requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.035);
 const speed=24, yawSpeed=1.35;
 drone.rotation.y-=R.x*yawSpeed*dt;
 const forward=new THREE.Vector3(Math.sin(drone.rotation.y),0,-Math.cos(drone.rotation.y));
 const right=new THREE.Vector3(Math.cos(drone.rotation.y),0,Math.sin(drone.rotation.y));
 drone.position.addScaledVector(forward,-L.y*speed*dt);drone.position.addScaledVector(right,L.x*speed*dt);
 drone.position.y=THREE.MathUtils.clamp(drone.position.y-R.y*15*dt,2,55);
 drone.rotation.z=THREE.MathUtils.lerp(drone.rotation.z,-L.x*.22,.08);
 drone.rotation.x=THREE.MathUtils.lerp(drone.rotation.x,L.y*.13,.08);
 drone.children.forEach(o=>{if(o.userData.prop)o.rotation.y+=28*dt});
 const camOffset=new THREE.Vector3(0,5.8,16).applyAxisAngle(new THREE.Vector3(0,1,0),drone.rotation.y);
 const target=drone.position.clone().add(camOffset);camera.position.lerp(target,.08);camera.lookAt(drone.position.clone().add(forward.clone().multiplyScalar(-8)));
 renderer.render(scene,camera);
}
</script>
</body></html>
