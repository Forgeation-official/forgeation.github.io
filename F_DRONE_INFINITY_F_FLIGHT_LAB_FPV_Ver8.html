<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>F DRONE ∞ — F FLIGHT LAB</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
#lab{background:
 radial-gradient(circle at 50% 38%,rgba(0,181,255,.24),transparent 30%),
 linear-gradient(180deg,#06182c 0%,#07101d 56%,#02060c 100%);overflow:auto}
.lab-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{position:absolute;left:22px;top:max(18px,env(safe-area-inset-top));font-weight:900;letter-spacing:.08em}.brand b{color:#41d8ff}
.room{width:min(1050px,94vw);border:1px solid rgba(107,222,255,.32);border-radius:30px;background:linear-gradient(145deg,rgba(13,36,62,.93),rgba(3,11,22,.96));box-shadow:0 30px 100px #000,0 0 80px rgba(0,188,255,.08) inset;padding:clamp(22px,4vw,54px)}
.kicker{font-size:12px;letter-spacing:.25em;color:#7ee7ff;font-weight:800}.room h1{font-size:clamp(32px,6vw,74px);margin:8px 0 2px;line-height:.95}.room h1 span{color:#31d8ff}.sub{opacity:.72;margin-bottom:28px}
.console{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}
.monitor,.panel{border-radius:20px;border:1px solid rgba(100,220,255,.24);background:#020b16;min-height:270px;position:relative;overflow:hidden}
.monitor{display:flex;align-items:center;justify-content:center;background:
 linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
 radial-gradient(circle at 65% 42%,#23b7c9 0 3%,transparent 4%),
 linear-gradient(150deg,#143f5e,#08131e 55%,#0a2b37)}
.monitor:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(73,211,255,.025) 5px)}
.destination{text-align:center;z-index:2}.destination small{letter-spacing:.22em;color:#79e5ff}.destination strong{display:block;font-size:clamp(27px,4vw,48px);margin:8px}.destination p{opacity:.7;margin:0}
.panel{padding:22px}.panel h3{margin:0 0 18px}.dest{width:100%;padding:13px 15px;margin:6px 0;border:1px solid rgba(102,222,255,.25);border-radius:12px;background:#07192b;text-align:left}.dest.active{border-color:#42ddff;box-shadow:0 0 20px rgba(40,210,255,.18)}
.launch{display:block;margin:26px auto 0;padding:17px 42px;border-radius:15px;border:1px solid #53e4ff;background:linear-gradient(180deg,#0879a1,#034761);font-weight:900;font-size:19px;box-shadow:0 0 28px rgba(35,211,255,.3)}
#flight{background:#000}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,.5)}
.hud{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:rgba(2,10,18,.66);border:1px solid rgba(119,230,255,.45);backdrop-filter:blur(8px);border-radius:11px;padding:8px 11px;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);opacity:.65}
.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{left:13px;top:0;width:2px;height:28px}.cross:after{top:13px;left:0;height:2px;width:28px}
.rec{position:absolute;left:18px;top:70px;font-size:12px;background:rgba(0,0,0,.45);padding:7px 9px;border-radius:9px}.dot{display:inline-block;width:8px;height:8px;background:#ff3d46;border-radius:50%;margin-right:6px}
.caption{position:absolute;top:72px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000;font-weight:900;letter-spacing:.08em}
.controls{position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;bottom:max(25px,calc(env(safe-area-inset-bottom) + 15px));width:132px;height:132px;border:1px solid rgba(190,240,255,.5);border-radius:50%;background:rgba(0,12,20,.25);backdrop-filter:blur(3px);pointer-events:auto;touch-action:none}
#leftStick{left:22px}#rightStick{right:22px}.knob{position:absolute;width:54px;height:54px;left:39px;top:39px;border-radius:50%;background:rgba(76,219,255,.3);border:2px solid rgba(190,246,255,.9);box-shadow:0 0 20px rgba(50,220,255,.35)}
.stick label{position:absolute;top:-23px;width:100%;text-align:center;font-size:10px;font-weight:800;text-shadow:0 2px 5px #000}
.back{position:absolute;left:16px;bottom:175px;pointer-events:auto;border:1px solid rgba(180,240,255,.5);background:rgba(0,10,20,.55);padding:9px 12px;border-radius:10px}
.help{position:absolute;right:17px;bottom:175px;text-align:right;font-size:10px;line-height:1.5;text-shadow:0 2px 5px #000}
@media(max-width:700px){.console{grid-template-columns:1fr}.panel{min-height:auto}.room{margin-top:40px}.stick{width:112px;height:112px}.knob{left:34px;top:34px;width:44px;height:44px}.caption{top:112px;font-size:12px}.stats{max-width:180px}.help{display:none}}
</style>
</head>
<body>
<div id="app">
<section id="lab" class="screen on">
 <div class="brand"><b>F</b> Forgeation</div>
 <div class="lab-wrap">
  <div class="room">
   <div class="kicker">AI ROBOTICS ACADEMY / F FLIGHT LAB</div>
   <h1>F DRONE <span>∞</span></h1>
   <div class="sub">Forgeationの教室から、世界へ。</div>
   <div class="console">
    <div class="monitor">
      <div class="destination"><small>DESTINATION</small><strong id="destName">SINGAPORE SKY ARENA</strong><p>LIVE CAMERA LINK READY</p></div>
    </div>
    <div class="panel">
      <h3>WORLD FLIGHT</h3>
      <button class="dest active" data-name="SINGAPORE SKY ARENA" data-theme="sg">🇸🇬 Singapore — Marina Bay</button>
      <button class="dest" data-name="TOKYO SKY STADIUM" data-theme="tokyo">🇯🇵 Tokyo — Bay Stadium</button>
      <button class="dest" data-name="BARCELONA COAST ARENA" data-theme="barca">🇪🇸 Barcelona — Coast Arena</button>
      <button class="dest" data-name="NEXT WORLD / ∞" data-theme="world">🌍 World Stadium — ∞</button>
    </div>
   </div>
   <button id="launch" class="launch">CONNECT & TAKE OFF →</button>
  </div>
 </div>
</section>

<section id="flight" class="screen">
 <canvas id="view"></canvas>
 <div class="vignette"></div>
 <div class="hud">
  <div class="topbar"><div class="pill">F DRONE ∞</div><div class="stats"><div class="pill">GPS ●●●●</div><div class="pill">BAT <span id="bat">98</span>%</div><div class="pill">ALT <span id="alt">32</span>m</div><div class="pill">SPD <span id="spd">0</span>km/h</div></div></div>
  <div class="rec"><span class="dot"></span>REC &nbsp; 4K LIVE</div>
  <div class="caption"><span id="flightName">SINGAPORE SKY ARENA</span><br><small>FPV CAMERA</small></div>
  <div class="cross"></div>
 </div>
 <div class="controls">
  <button class="back" id="returnLab">← F FLIGHT LAB</button>
  <div class="stick" id="leftStick"><label>ALTITUDE / YAW</label><div class="knob"></div></div>
  <div class="stick" id="rightStick"><label>FLIGHT / STRAFE</label><div class="knob"></div></div>
  <div class="help">PC: W/S 前後　A/D 左右<br>←/→ 旋回　↑/↓ 高度</div>
 </div>
</section>
</div>

<script>
const lab=document.getElementById('lab'), flight=document.getElementById('flight'), canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
let theme='sg', name='SINGAPORE SKY ARENA';
document.querySelectorAll('.dest').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dest').forEach(x=>x.classList.remove('active'));b.classList.add('active');theme=b.dataset.theme;name=b.dataset.name;destName.textContent=name});
launch.onclick=()=>{lab.classList.remove('on');flight.classList.add('on');flightName.textContent=name;resize();};
returnLab.onclick=()=>{flight.classList.remove('on');lab.classList.add('on')};
let W=0,H=0,t=0,yaw=0,pitch=0,forward=0,strafe=0,altitude=32,keys={};
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize); addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function stick(el, cb){let k=el.querySelector('.knob'),active=false;function move(e){if(!active)return;let p=e.touches?e.touches[0]:e,r=el.getBoundingClientRect(),x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2),m=r.width*.32,d=Math.hypot(x,y);if(d>m){x*=m/d;y*=m/d}k.style.transform=`translate(${x}px,${y}px)`;cb(x/m,y/m)}function end(){active=false;k.style.transform='';cb(0,0)}el.addEventListener('pointerdown',e=>{active=true;el.setPointerCapture(e.pointerId);move(e)});el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
let ls=[0,0],rs=[0,0];stick(leftStick,(x,y)=>ls=[x,y]);stick(rightStick,(x,y)=>rs=[x,y]);
function skyline(base,offset){
 ctx.fillStyle='rgba(3,15,27,.82)';
 for(let i=-2;i<22;i++){let x=(i*82+offset)% (W+180)-90,h=45+((i*37)%110+110)%110;ctx.fillRect(x,base-h,65,h);
 ctx.fillStyle='rgba(86,220,255,.38)';for(let j=0;j<3;j++)for(let k=0;k<4;k++)ctx.fillRect(x+10+j*17,base-h+15+k*19,5,8);ctx.fillStyle='rgba(3,15,27,.82)'}
}
function draw(){
 requestAnimationFrame(draw); if(!flight.classList.contains('on'))return;t+=.016;
 let f=(keys.w?1:0)-(keys.s?1:0)-rs[1], s=(keys.d?1:0)-(keys.a?1:0)+rs[0], y=(keys.arrowright?1:0)-(keys.arrowleft?1:0)+ls[0], a=(keys.arrowup?1:0)-(keys.arrowdown?1:0)-ls[1];
 yaw+=y*.018;forward+=f*.055;strafe+=s*.04;altitude=Math.max(5,Math.min(120,altitude+a*.32));
 let horizon=H*.42 + Math.sin(forward*.15)*8;
 let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,theme==='sg'?'#73cde7':'#78c8ef');sky.addColorStop(1,'#d7eef0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
 // clouds
 ctx.fillStyle='rgba(255,255,255,.72)';for(let i=0;i<7;i++){let x=((i*241-yaw*190+W*2)%(W+300))-120, yy=75+(i%3)*55;ctx.beginPath();ctx.ellipse(x,yy,55,18,0,0,Math.PI*2);ctx.fill()}
 skyline(horizon+45,(-yaw*230-strafe*20));
 // water / city foreground
 let g=ctx.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#176b7c');g.addColorStop(.42,'#164653');g.addColorStop(1,'#07151d');ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);
 // perspective guide / shoreline
 ctx.strokeStyle='rgba(123,231,236,.24)';ctx.lineWidth=2;for(let i=0;i<14;i++){let yy=horizon+Math.pow(i/13,2)*(H-horizon);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}
 // stadium in FPV scene
 let cx=W*.5-Math.sin(yaw)*W*.22-strafe*9, cy=horizon+H*.24+Math.sin(forward*.2)*25, scale=Math.max(.65,1+forward*.012);
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 ctx.fillStyle='#cbd4d6';ctx.beginPath();ctx.ellipse(0,0,Math.min(W*.34,350),110,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#15252c';ctx.beginPath();ctx.ellipse(0,0,Math.min(W*.29,300),82,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#319554';ctx.beginPath();ctx.ellipse(0,5,Math.min(W*.22,230),58,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.strokeRect(-85,-34,170,68);ctx.restore();
 // FPV lower nose: deliberately tiny, not an external drone view
 ctx.fillStyle='rgba(5,10,13,.72)';ctx.beginPath();ctx.moveTo(W*.46,H);ctx.lineTo(W*.485,H-20);ctx.lineTo(W*.515,H-20);ctx.lineTo(W*.54,H);ctx.fill();
 document.getElementById('alt').textContent=Math.round(altitude);document.getElementById('spd').textContent=Math.round(Math.abs(f)*38+Math.abs(s)*18);document.getElementById('bat').textContent=Math.max(21,98-Math.floor(t/35));
}
resize();draw();
</script>
</body></html>
