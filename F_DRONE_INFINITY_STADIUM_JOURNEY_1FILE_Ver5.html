<head>

<title>F DRONE ∞ STADIUM JOURNEY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
#intro,#game{position:fixed;inset:0}#intro{z-index:20;background:#020914;display:flex;align-items:center;justify-content:center}
#intro img{width:100%;height:100%;object-fit:contain}
#takeoff{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);width:min(42vw,430px);height:min(10vw,105px);border:0;border-radius:24px;background:rgba(0,145,200,.10);color:transparent;cursor:pointer}
#game{display:none;background:#071423}canvas{width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px}
.badge{background:rgba(1,10,20,.65);border:1px solid rgba(95,223,255,.45);padding:9px 12px;border-radius:14px;font-weight:800;backdrop-filter:blur(8px)}
#mission{position:absolute;top:72px;left:50%;transform:translateX(-50%);text-align:center;background:rgba(1,10,20,.58);padding:8px 15px;border-radius:14px;font-size:14px}
.controls{pointer-events:auto;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px}.btn{border:1px solid rgba(120,230,255,.6);background:rgba(4,31,48,.72);color:#fff;border-radius:17px;font-size:24px;font-weight:900;touch-action:none}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
.alt{display:flex;gap:8px}.alt .btn{width:64px;height:64px;font-size:18px}
#next{pointer-events:auto;position:absolute;right:16px;top:72px;border:1px solid #5fdfff;background:rgba(3,45,65,.8);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800}
@media(max-width:700px){#intro img{object-fit:contain}#takeoff{top:78%;width:55vw;height:8vh}.badge{font-size:12px}.pad{transform:scale(.88);transform-origin:left bottom}.alt{transform:scale(.9);transform-origin:right bottom}}
</style>

<div id="game">
<canvas id="c"></canvas>
<div class="hud">
 <div class="top"><div class="badge">F DRONE ∞</div><div class="badge">STAGE <span id="stage">1</span> / ∞</div></div>
 <div id="mission">WORLD STADIUM JOURNEY — 黒いF DRONEで飛行</div>
 <button id="next">NEXT STADIUM →</button>
 <div class="controls">
  <div class="pad"><button class="btn up" data-k="up">▲</button><button class="btn left" data-k="left">◀</button><button class="btn right" data-k="right">▶</button><button class="btn down" data-k="down">▼</button></div>
  <div class="alt"><button class="btn" data-k="rise">UP</button><button class="btn" data-k="fall">DOWN</button></div>

</div>
<script>
const intro=document.querySelector('#intro'),game=document.querySelector('#game'),canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');
let W=0,H=0,t=0,stage=1,x=0,y=0,alt=1,yaw=0,keys={};
const cities=["TOKYO","LONDON","MADRID","BARCELONA","MILAN","MUNICH","PARIS","RIO","BUENOS AIRES","WORLD STADIUM"];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();
function start(){intro.style.display='none';game.style.display='block';requestAnimationFrame(loop)}
document.querySelector('#takeoff').onclick=start;
document.querySelector('#next').onclick=()=>{stage++;document.querySelector('#stage').textContent=stage;x=y=yaw=0};
for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=0}
addEventListener('keydown',e=>{if(e.key==="ArrowUp")keys.up=1;if(e.key==="ArrowDown")keys.down=1;if(e.key==="ArrowLeft")keys.left=1;if(e.key==="ArrowRight")keys.right=1;if(e.key==="w")keys.rise=1;if(e.key==="s")keys.fall=1});
addEventListener('keyup',e=>{keys={...keys,up:0,down:0,left:0,right:0,rise:0,fall:0}});
function stadium(){
 const cx=W/2-x*.5, cy=H*.48-y*.25, rw=Math.min(W*.42,430)*(1+alt*.03), rh=rw*.46;
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#06172b");g.addColorStop(.55,"#0b3550");g.addColorStop(1,"#071019");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // skyline / lights
 ctx.fillStyle="rgba(45,155,190,.22)";for(let i=0;i<30;i++){let bx=(i*97+stage*41)%W,bh=30+((i*31)%90);ctx.fillRect(bx,H*.45-bh,35,H*.55+bh)}
 ctx.save();ctx.translate(cx,cy);ctx.strokeStyle="#8beaff";ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(0,0,rw,rh,0,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#143f32";ctx.beginPath();ctx.ellipse(0,0,rw*.72,rh*.70,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2;ctx.strokeRect(-rw*.42,-rh*.42,rw*.84,rh*.84);ctx.beginPath();ctx.moveTo(0,-rh*.42);ctx.lineTo(0,rh*.42);ctx.stroke();
 for(let i=0;i<40;i++){let a=i/40*Math.PI*2;ctx.fillStyle=i%3?"#d8f8ff":"#5fdfff";ctx.beginPath();ctx.arc(Math.cos(a)*rw,Math.sin(a)*rh,2.2,0,7);ctx.fill()}ctx.restore();
 ctx.fillStyle="rgba(220,248,255,.9)";ctx.font="700 16px system-ui";ctx.textAlign="center";ctx.fillText(cities[(stage-1)%cities.length]+" — STADIUM "+stage,W/2,44);
}
function drone(){
 const dx=W/2+yaw*18,dy=H*.70-alt*18;
 ctx.save();ctx.translate(dx,dy);ctx.rotate(-yaw*.15);
 ctx.strokeStyle="#111820";ctx.lineWidth=10;ctx.lineCap="round";
 [[-7,-3,-54,-28],[7,-3,54,-28],[-7,5,-50,31],[7,5,50,31]].forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke()});
 ctx.fillStyle="#090d12";ctx.beginPath();ctx.roundRect(-29,-22,58,48,12);ctx.fill();
 for(const q of [[-55,-29],[55,-29],[-51,32],[51,32]]){ctx.strokeStyle="#53606a";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(q[0],q[1],25,6,0,0,7);ctx.stroke();ctx.fillStyle="#101820";ctx.beginPath();ctx.arc(q[0],q[1],7,0,7);ctx.fill()}
 ctx.fillStyle="#28cfff";ctx.fillRect(-18,14,36,3);ctx.fillStyle="#fff";ctx.font="900 19px system-ui";ctx.textAlign="center";ctx.fillText("F",0,5);ctx.restore()
}
function loop(){
 t+=.016;if(keys.left){yaw=Math.max(-1,yaw-.035);x-=2}if(keys.right){yaw=Math.min(1,yaw+.035);x+=2}if(!keys.left&&!keys.right)yaw*=.94;
 if(keys.up)y+=2;if(keys.down)y-=2;if(keys.rise)alt=Math.min(5,alt+.035);if(keys.fall)alt=Math.max(.2,alt-.035);
 stadium();drone();requestAnimationFrame(loop)
}
