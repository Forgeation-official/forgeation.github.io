<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F Mind | Forgeation</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7fffd,#d9f5ef);color:#123;font-family:-apple-system,"Noto Sans JP",sans-serif}main{max-width:440px;margin:auto;padding:15px 15px 30px}.hero{border-radius:22px;overflow:hidden;border:1px solid #18bfae}.hero img{width:100%;display:block}h1{font-size:32px;margin:18px 0 4px}.tag{color:#087f75;font-size:18px;font-weight:900}.intro{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px 7px;margin:22px 0}.m{border:0;background:none;color:#123}.m i{width:91px;height:91px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:34px;font-style:normal;background:radial-gradient(circle,#c9fff7,#fff 72%);border:2px solid #18bfae}.m b{display:block;font-size:12px;margin-top:7px}.card{padding:16px;border-radius:20px;border:1px solid #18bfae;background:#ffffffbb}.bar{height:9px;background:#1232;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#18bfae}.a{width:100%;padding:12px;margin-top:9px;border-radius:13px;border:1px solid #18bfae;background:#18bfae16;color:#123;font-weight:800}#fb{margin-top:10px;color:#087f75}</style></head><body><main><div class="hero"><img src="f-mind-main.webp" alt="F Mind"></div><h1>F Mind</h1><div class="tag">気配り。目配り。心配り。<br>そのひとつが、誰かの安心になる。</div><p class="intro">介護現場の基本「3配り」を場面判断として身につける。小さな変化に気づき、相手を尊重するケアを次世代へ。</p><section class="grid"><button class="m"><i>🤝</i><b>気配り</b></button><button class="m"><i>👀</i><b>目配り</b></button><button class="m"><i>❤️</i><b>心配り</b></button><button class="m"><i>🧩</i><b>ケース判断</b></button><button class="m"><i>📋</i><b>支援記録</b></button><button class="m"><i>🤖</i><b>AI相談室</b></button></section><section class="card"><b>🏆 3配り Challenge　<span id="xp">0 XP</span></b><div class="bar"><i id="fill"></i></div><p>いつもより口数が少なく、食事の手も止まっている。最初にどうする？</p><button class="a" data-n="20">表情や体調を確認し、穏やかに声をかける</button><button class="a" data-n="15">少し距離を取りながら観察する</button><button class="a" data-n="5">こちらの判断ですぐ行動する</button><div id="fb">選択するとXPが反映されます。</div></section></main><script>let x=+localStorage.FMindXP||0;function r(){xp.textContent=x+' XP';fill.style.width=(x%100)+'%'}r();document.querySelectorAll('.a').forEach(b=>b.onclick=()=>{x+=+b.dataset.n;localStorage.FMindXP=x;r();fb.textContent=b.textContent+' ＋'+b.dataset.n+' XP'});</script></body></html>
