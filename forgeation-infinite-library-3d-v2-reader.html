);if(n===current)e.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});yaw=0;pitch=0;view();status('読み込み中…');const candidates=current===6?[encodeURI('07_レインボーラウンジ_360-development.jpg'),encodeURI('07_レインボーラウンジ_360-development.jpg')]:[encodeURI(b+'_360-development.jpg')];const loader=new THREE.TextureLoader();function tryLoad(k){loader.load(candidates[k],t=>{if(token!==loading){t.dispose();return}t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(texture)texture.dispose();texture=t;mesh.material.map=t;mesh.material.needsUpdate=true;status('')},undefined,()=>{if(token!==loading)return;if(k+1<candidates.length)tryLoad(k+1);else status('360°画像を読み込めません：'+b+'_360-development.jpg')})}tryLoad(0)}function move(dx,dy){yaw+=dx;pitch+=dy;view()}const stage=$('stage');stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};move(-dx*.0045,-dy*.0045)});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(45,Math.min(90,fov+e.deltaY*.04));view()},{passive:false});$('left').onclick=()=>move(-.25,0);$('right').onclick=()=>move(.25,0);$('up').onclick=()=>move(0,.2);$('down').onclick=()=>move(0,-.2);$('reset').onclick=()=>{yaw=0;pitch=0;fov=72;view()};$('next').onclick=()=>show(current+1);$('photo').onclick=()=>{const p=$('photoViewer'),im=$('photoImage'),name=base[current]+'.png';const variants=[name.normalize('NFC'),name.normalize('NFD')];let attempt=0;im.onerror=()=>{if(++attempt<variants.length){im.src=encodeURI(variants[attempt]);}else{im.removeAttribute('src');$('photoCaption').textContent=names[current]+'：写真ファイルが見つかりません';}};im.onload=()=>{$('photoCaption').textContent=names[current]};im.alt=names[current]+'の let BOOKS=[{"id": 1, "title": "はじめての図書館", "area": 0, "desc": "この図書館は、知りたい気持ちを大切にする場所です。", "chapters": [{"title": "本の読み方", "text": "本は、最初から最後まで読まなくてもかまいません。目次を眺め、気になる章を選ぶだけでも新しい発見があります。わからない言葉に出会ったら、その場で意味を調べたり、自分の言葉に置き換えたりしてみましょう。"}, {"title": "自分の本棚を作ろう", "text": "好きな題材を三つ書き出してみましょう。たとえば、電車、宇宙、料理。そこから関連する本を一冊ずつ選び、読んでわかったことを一行残します。読書の楽しさは、冊数ではなく発見の数にもあります。"}]}, {"id": 2, "title": "夜空を見上げる科学", "area": 1, "desc": "星を見つめることから、科学の旅が始まります。", "chapters": [{"title": "光と星", "text": "夜空の星は、遠く離れた天体です。星の光が地球に届くまでには時間がかかります。遠い星を観察することは、昔の宇宙の姿を見ることでもあります。"}, {"title": "観察のすすめ", "text": "同じ場所で、同じ時刻に空を見てみましょう。月の形や星の位置の変化に気づくはずです。気づいたことを日付と一緒に記録すれば、自分だけの観察ノートが完成します。"}]}, {"id": 3, "title": "物語の入口", "area": 2, "desc": "物語を読むと、まだ知らない人生に出会えます。", "chapters": [{"title": "主人公の目線", "text": "同じ出来事でも、見る人が変われば意味が変わります。主人公がなぜその行動を選んだのか、ほかの選択肢はなかったのか。そんな問いを持つと、物語はもっと立体的になります。"}, {"title": "一文から想像する", "text": "「扉の向こうから、風の音がした。」この一文から、どんな場所を思い浮かべますか。海辺、山の家、宇宙船。想像した景色を三行で書いてみましょう。"}]}, {"id": 4, "title": "地図から始まる世界史", "area": 3, "desc": "場所を知ると、歴史の出来事がつながります。", "chapters": [{"title": "地図と暮らし", "text": "川の近くには水を使った暮らしが生まれ、港には人や物が集まります。地形や気候は、都市の発展に大きな影響を与えてきました。"}, {"title": "昔と今を比べる", "text": "今住んでいる地域の古い地図と新しい地図を比べると、道や鉄道、建物の変化が見えてきます。歴史は遠い国だけでなく、身近な町にも残っています。"}]}, {"id": 5, "title": "考える力の数学とAI", "area": 4, "desc": "数学もプログラミングも、考えを順序立てる練習です。", "chapters": [{"title": "問題を小さくする", "text": "難しい問題に出会ったら、条件を一つずつ書き出します。何がわかっていて、何を求めるのか。小さな問題に分けると、解決への道筋が見えてきます。"}, {"title": "AIと人の役割", "text": "AIは文章の整理や案出しを助けますが、答えが常に正しいとは限りません。計算や根拠を確かめ、最後に判断するのは人間です。AIを仲間として使いながら、自分の考える力も育てましょう。"}]}, {"id": 6, "title": "問いを育てる時間", "area": 5, "desc": "正解が一つでない問いも、学びの大切な入口です。", "chapters": [{"title": "なぜを重ねる", "text": "「なぜそう思ったのか」と自分に尋ねると、考えの奥にある経験や価値観が見えてきます。相手の答えが違っても、すぐに否定せず理由を聞いてみましょう。"}, {"title": "心を整える", "text": "考えがまとまらないときは、短い文章にして書き出してみます。事実と気持ちを分けるだけで、次にできることが少し見えやすくなります。"}]}, {"id": 7, "title": "にじいろの小さな冒険", "area": 6, "desc": "子どもも大人も楽しめる、オリジナルの短いお話です。", "chapters": [{"title": "あおい鳥の落とし物", "text": "ある朝、あおい鳥は虹のかけらを見つけました。「これはだれのものだろう？」森の仲間にたずねても、だれも知りません。鳥は、かけらを空にかざしてみました。すると、きらきらした道が現れました。"}, {"title": "虹のむこう", "text": "道の先には、雨上がりの花畑がありました。虹のかけらは、そこにいた小さな雲のものでした。「さがしてくれてありがとう！」雲が笑うと、空いっぱいに虹が広がりました。鳥は思いました。だれかのために動くと、世界は少し明るくなるんだ。"}]}, {"id": 8, "title": "映画をもっと楽しむ本", "area": 7, "desc": "映像の見方を知ると、一つの場面がもっと面白くなります。", "chapters": [{"title": "画面が語ること", "text": "映画では、台詞がなくても光、色、音、カメラの動きで気持ちを伝えます。登場人物が小さく映る場面には、広い世界での孤独が表現されているかもしれません。"}, {"title": "鑑賞ノート", "text": "映画を見終えたら、心に残った場面を一つ選びましょう。何が映っていたか、どんな音が聞こえたか、なぜ心に残ったか。三つの視点で書くと、自分の感想がより豊かになります。"}]}, {"id": 9, "title": "健康と支え合いの基礎", "area": 8, "desc": "健康や福祉を考えるための、やさしい入門書です。", "chapters": [{"title": "健康を支えるもの", "text": "健康は、食事や運動だけでなく、睡眠、人とのつながり、安心して過ごせる環境にも支えられています。自分に合う生活の工夫を少しずつ見つけることが大切です。"}, {"title": "相手の話を聞く", "text": "誰かを支えるとき、すぐに答えを出すことだけが助けではありません。困っていることを丁寧に聞き、本人が望むことを確かめる姿勢も大切です。この本は一般的な学習用で、医療上の判断に代わるものではありません。"}]}, {"id": 10, "title": "未来をつくる小さな一歩", "area": 9, "desc": "Forgeationオリジナル。挑戦のきっかけを見つける本です。", "chapters": [{"title": "才能の種", "text": "得意なことがまだ見つからなくても、好きなことや気になることの中に才能の種が隠れているかもしれません。昨日より少し詳しくなること、誰かに教えてみること。その積み重ねが、自分らしい道につながります。"}, {"title": "未来へのメモ", "text": "やってみたいことを一つ選び、今日できる最小の行動を書いてみましょう。大きな夢でも、最初の一歩は小さくてかまいません。未来は、考えることと行動することの間から形になっていきます。"}]}], THEMES=["総合案内・新着図書", "宇宙・天文学・科学", "日本文学・世界文学", "歴史・地理・社会", "数学・IT・AI", "哲学・心理学・思想", "絵本・児童書・教育", "映画・芸術・音楽", "医療・福祉・健康", "Forgeationオリジナル作品"];

// 蔵書は別ファイルで管理。JSON未公開時も初期10冊で動作を継続する。
async function loadCatalog(){
 try{
  const response=await fetch('./forgeation-library-books.json',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!Array.isArray(data.books)||!Array.isArray(data.themes))throw new Error('Invalid catalog');
  const valid=data.books.filter(b=>b&&typeof b.title==='string'&&Number.isInteger(b.area)&&b.area>=0&&b.area<10&&Array.isArray(b.chapters)&&b.chapters.length&&b.chapters.every(c=>typeof c.title==='string'&&typeof c.text==='string'));
  if(!valid.length)throw new Error('Empty catalog');

 }catch(e){BOOKS=[];const note=document.getElementById('libNotice');if(note)note.textContent=tr('failed');console.warn('蔵書JSONの読み込みに失敗:',e.message)}
}

function bookTitle(b){const map=b.titles||b.localizedTitles||b.translatedTitles||{};return map[language]||b['title'+language.charAt(0).toUpperCase()+language.slice(1)]||(language==='ja'&&b.titleJa)||(language==='en'&&(b.originalTitle||b.titleOriginal))||b.title}

 const assign=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=tr(key)};
 [['bookFindTop','find'],['bookFindBottom','find'],['bookHotspot','areaFind'],['libClose','back'],['shelfReturn','back'],['shelfAllBooks','allBooks'],['detailBack','backList'],['libBack','backList'],['detailExternal','source'],['fontSmaller','smaller'],['fontLarger','larger'],['prevChapter','prev'],['nextChapter','next']].forEach(([id,key])=>assign(id,key));
 const title=document.querySelector('#libBrowse h2'),intro=document.querySelector('#libBrowse > p'),search=document.getElementById('libSearch'),shelfIntro=document.querySelector('#realShelf .shelfSub'),shelfFoot=document.querySelector('#realShelf .shelfFoot'),hint=document.querySelector('.readerSwipeHint'),note=document.getElementById('libNotice');
 if(title)title.textContent=tr('browse');if(intro)intro.textContent=tr('intro');if(search){search.placeholder=tr('search');search.setAttribute('aria-label',tr('search'))};if(shelfIntro)shelfIntro.textContent=tr('shelfIntro');if(shelfFoot)shelfFoot.textContent=tr('foot');if(hint)hint.textContent=tr('swipe');if(note)note.textContent=tr('notice');
 const shelfOpen=document.getElementById('realShelf')?.classList.contains('open');
 if(shelfOpen)approachShelf((document.getElementById('realShelf').dataset.area==='all'?-1:Number(document.getElementById('realShelf').dataset.area)));
 if(document.getElementById('libraryPanel')?.classList.contains('open')){renderThemes();renderBooks();if(selected){if(document.getElementById('libReader').classList.contains('open'))read(selected,chapter);else if(document.getElementById('libDetail').style.display!=='none')showDetail(selected)}}
}
function setupLanguagePicker(){const picker=document.createElement('label');picker.id='libraryLanguagePicker';picker.setAttribute('aria-label','Language / 言語');picker.innerHTML='<span>🌐</span><select id="libraryLanguage" aria-label="Language / 言語"></select>';const select=picker.querySelector('select');Object.entries(LANGUAGES).forEach(([code,label])=>{const opt=document.createElement('option');opt.value=code;opt.textContent=label;select.append(opt)});select.value=language;select.onchange=()=>{language=select.value;localStorage.setItem('forgeationLibraryLanguage',language);updateGlobalLabels()};document.querySelector('header .top').prepend(picker);updateGlobalLabels()}

const top=document.querySelector('header .top'),controls=document.querySelector('.controls');

const panel=document.createElement('section');panel.id='libraryPanel';panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','図書館の本棚');panel.innerHTML=`<div class="libHead"><strong>FORGEATION · BOOKS</strong><button id="libClose" type="button">↩ 360°に戻る</button></div><div id="libBrowse"><h2>📚 本棚を探す</h2><p>10エリアの書架から本を選べます。本文のある作品は館内で読書できます。</p><input id="libSearch" type="search" placeholder="本のタイトル・キーワードで検索" aria-label="蔵書を検索"><div id="libThemes"></div><div id="libCount"></div><div id="libGrid"></div><p id="libNotice">実在する書籍の案内です。本文を収録していない作品は館内で読むことができません。日本語本文・翻訳は利用条件を確認した作品から順次対応します。</p></div><div id="libDetail" style="display:none;max-width:720px;margin:24px auto"><button id="detailBack" type="button">← 本棚へ戻る</button><h2 id="detailTitle"></h2><p id="detailAuthor"></p><p id="detailDesc"></p><div class="detailActions"><button id="detailRead" type="button">📖 本を読む</button><a id="detailExternal" target="_blank" rel="noopener noreferrer">🔗 正規の提供元で探す</a></div><p id="detailStatus"></p></div><div id="libReader"><button id="libBack">← 本棚へ戻る</button><h2 id="readerTitle"></h2><p id="readerDesc"></p><div class="readerSettings"><button id="fontSmaller" type="button" aria-label="文字を小さく">文字 −</button><span id="fontLabel">17px</span><button id="fontLarger" type="button" aria-label="文字を大きく">文字 ＋</button></div><article class="paper" id="readingPaper"><h3 id="chapterTitle"></h3><p id="chapterText"></p></article><p class="readerSwipeHint">← 左右にスワイプしてページをめくる →</p><div class="readerNav"><button id="prevChapter">← 前の章</button><span id="chapterNum"></span><button id="nextChapter">次の章 →</button></div></div>`;document.body.append(panel);
const $=id=>document.getElementById(id);let filter=-1,selected=null,chapter=0,previousFocus=null,readerFromShelf=false;
function area(){const t=$('title').textContent;const n=names.findIndex(n=>t.includes(n));return n<0?0:n}
function renderThemes(){const box=$('libThemes');box.replaceChildren();[-1,...names.map((_,i)=>i)].forEach(i=>{const b=document.createElement('button');b.textContent=i<0?tr('all'):areaLabel(i);b.className=filter===i?'selected':'';b.setAttribute('aria-pressed',filter===i?'true':'false');b.onclick=()=>{filter=i;renderThemes();renderBooks()};box.append(b)})}
function renderBooks(){const q=$('libSearch').value.trim().toLocaleLowerCase();const found=BOOKS.filter(b=>(filter<0||b.area===filter)&&(bookTitle(b)+' '+(b.title||'')+' '+(b.originalTitle||'')+' '+bookDesc(b)+' '+names[b.area]+' '+areaLabel(b.area)+' '+THEMES[b.area]).toLocaleLowerCase().includes(q));$('libCount').textContent=`${found.length}${tr('shown')}${BOOKS.length}${tr('books')}`;const grid=$('libGrid');grid.replaceChildren();found.forEach(b=>{const btn=document.createElement('button');const cover=document.createElement('span');cover.className='cover';cover.textContent=bookTitle(b);const title=document.createElement('strong');title.textContent=bookTitle(b);const meta=document.createElement('small');meta.textContent=areaLabel(b.area)+' · '+tr('details');btn.append(cover,title,meta);btn.onclick=()=>showDetail(b);grid.append(btn)});if(!found.length)grid.textContent=tr('none')}
 const shelf=document.createElement('section');shelf.id='realShelf';shelf.setAttribute('role','dialog');shelf.setAttribute('aria-modal','true');shelf.setAttribute('aria-label','実写風の本棚');shelf.innerHTML=`<div class="shelfPhoto" id="shelfPhoto"></div><div class="shelfVignette"></div><div class="shelfContent"><div class="shelfTop"><div class="shelfBrand">FORGEATION · INFINITE LIBRARY</div><button type="button" id="shelfReturn">↩ 360°に戻る</button></div><h2 id="shelfHeading"></h2><p class="shelfSub">本の背表紙に触れて、書籍情報を開く</p><div class="shelfTools"><button type="button" id="shelfAllBooks">🔎 全蔵書から探す</button><span id="shelfAreaCount"></span></div><div class="woodCase" id="shelfWood"></div><p class="shelfFoot">背景の書籍は演出画像です。選べる本は手前のタイトルのみ。登録されている実在書籍の書誌案内です。表紙・本文の複製ではありません。<br>館内で読めない作品は、正規の提供元でご確認ください。</p></div>`;document.body.append(shelf);
 function closeShelf(){shelf.classList.remove('open');setTimeout(()=>{if(!shelf.classList.contains('open'))shelf.style.display='none'},660);document.body.style.overflow='';hotspot.focus()}
 $('shelfReturn').onclick=closeShelf;
 function approachShelf(areaFilter){
   // 実写風の木製書架を全エリアで維持。背景の本の色・質感はエリアごとに変える。
   $('shelfPhoto').style.backgroundImage='url("forgeation-library-shelf-realistic.webp")';
   $('shelfPhoto').style.backgroundPosition='center center';
   shelf.dataset.area=areaFilter<0?'all':String(areaFilter);
   const palette=[['#2a4051','#7a3328','#8c673d'],['#102c4e','#274b76','#a18b60'],['#543426','#2b3946','#745139'],['#60452b','#46302b','#273d43'],['#152c41','#244e57','#70533e'],['#3b2d48','#243e45','#715445'],['#9d4d59','#43798a','#b28d4d'],['#692c32','#233752','#8a6237'],['#275348','#375d70','#776343'],['#4b344e','#3e5260','#85644c']];
   const colors=palette[areaFilter<0?0:areaFilter];
   shelf.style.setProperty('--areaBook1',colors[0]);
   shelf.style.setProperty('--areaBook2',colors[1]);
   shelf.style.setProperty('--areaBook3',colors[2]);
   $('shelfHeading').textContent=areaFilter<0?tr('shelf'):areaLabel(areaFilter)+tr('areaShelf');
   const wood=$('shelfWood');wood.replaceChildren();
   // 装飾用のCSS背表紙は表示しない。写真の実写風書架を維持する。

   const areaBooks=BOOKS.filter(b=>areaFilter<0||b.area===areaFilter);
   $('shelfAreaCount').textContent=areaBooks.length+tr('count');
   $('shelfAllBooks').onclick=()=>openLibrary(-1,true);
   if(!areaBooks.length){const e=document.createElement('p');e.className='shelfEmpty';e.textContent=tr('noArea');wood.append(e)}
   else{for(let i=0;i<areaBooks.length;i+=8){const row=document.createElement('div');row.className='shelfRow';areaBooks.slice(i,i+8).forEach(b=>{const spine=document.createElement('button');spine.className='bookSpine';spine.type='button';spine.textContent=bookTitle(b);spine.title=bookTitle(b)+' / '+(b.author||tr('unknown'));spine.setAttribute('aria-label',bookTitle(b));spine.onclick=()=>{readerFromShelf=true;openLibrary(areaFilter,true);showDetail(b)};row.append(spine)});wood.append(row)}}
   shelf.style.display='block';requestAnimationFrame(()=>shelf.classList.add('open'));document.body.style.overflow='hidden';$('shelfReturn').focus();
 }
function openLibrary(areaFilter,fromShelf=false){if(!fromShelf)readerFromShelf=false;previousFocus=document.activeElement;filter=areaFilter;$('libSearch').value='';$('libReader').classList.remove('open');$('libDetail').style.display='none';$('libBrowse').style.display='block';renderThemes();renderBooks();panel.classList.add('open');panel.scrollTop=0;document.body.style.overflow='hidden';$('libClose').focus()}
function closeLibrary(){panel.classList.remove('open');readerFromShelf=false;if(shelf.classList.contains('open'))closeShelf();document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
let readerFontSize=Number(localStorage.getItem('forgeationReaderFont')||17);
function readable(b){return b.fullTextIncluded===true && Array.isArray(b.chapters) && b.chapters.some(c=>c.text&&c.text.trim())}
function showDetail(b){selected=b;$('libBrowse').style.display='none';$('libReader').classList.remove('open');$('libDetail').style.display='block';$('detailTitle').textContent=bookTitle(b);$('detailAuthor').textContent=tr('author')+(b.author||tr('unknown'));$('detailDesc').textContent=bookDesc(b);const available=readable(b);$('detailRead').disabled=!available;$('detailRead').textContent=available?tr('read'):tr('missing');$('detailStatus').textContent=available?tr('available'):tr('unavailable');const link=b.searchUrl||b.sourceUrl||'';$('detailExternal').style.display=link?'inline-flex':'none';if(link)$('detailExternal').href=link;panel.scrollTop=0}
function read(b,n){if(!readable(b)){showDetail(b);return}selected=b;chapter=n;$('libBrowse').style.display='none';$('libDetail').style.display='none';$('libReader').classList.add('open');$('readerTitle').textContent=bookTitle(b);$('readerDesc').textContent=b.author?tr('author')+b.author:'';$('chapterTitle').textContent=b.chapters[n].title;$('chapterText').textContent=b.chapters[n].text;$('readerLanguageNotice').textContent=bodyLanguage(b)&&bodyLanguage(b)!==language?tr('original'):'';$('chapterNum').textContent=`${n+1} / ${b.chapters.length}`;$('prevChapter').disabled=n===0;$('nextChapter').disabled=n===b.chapters.length-1;$('readingPaper').style.fontSize=readerFontSize+'px';$('fontLabel').textContent=readerFontSize+'px';panel.scrollTop=0}
$('detailRead').onclick=()=>{if(selected)read(selected,0)};
function backToBrowse(){if(readerFromShelf){panel.classList.remove('open');readerFromShelf=false;document.body.style.overflow='hidden';$('shelfReturn').focus()}else{$('libReader').classList.remove('open');$('libDetail').style.display='none';$('libBrowse').style.display='block';panel.scrollTop=0}}

let swipeX=null,swipeY=null;
$('readingPaper').addEventListener('touchstart',e=>{if(e.touches.length===1){swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY}},{passive:true});
$('readingPaper').addEventListener('touchend',e=>{if(swipeX===null||!selected)return;const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;swipeX=null;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4)return;if(dx<0&&chapter<selected.chapters.length-1)read(selected,chapter+1);else if(dx>0&&chapter>0)read(selected,chapter-1)},{passive:true});
const languageNote=document.createElement('p');languageNote.id='readerLanguageNotice';languageNote.setAttribute('role','status');languageNote.style.cssText='color:#ffe0a1;font-size:14px;line-height:1.6';$('libReader').insertBefore(languageNote,$('libReader').querySelector('.readerNav'));
setupLanguagePicker();
loadCatalog();
topBtn.onclick=()=>approachShelf(-1);bottomBtn.onclick=()=>approachShelf(-1);hotspot.onclick=()=>approachShelf(area());$('libClose').onclick=closeLibrary;$('libSearch').addEventListener('input',renderBooks);$('libBack').onclick=()=>{if(selected)showDetail(selected);else backToBrowse()};$('prevChapter').onclick=()=>{if(selected&&chapter>0)read(selected,chapter-1)};$('nextChapter').onclick=()=>{if(selected&&chapter<selected.chapters.length-1)read(selected,chapter+1)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open')){e.stopImmediatePropagation();closeLibrary()}else if(e.key==='Escape'&&shelf.classList.contains('open')){e.stopImmediatePropagation();closeShelf()}} ,true);
})();
