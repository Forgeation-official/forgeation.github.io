<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORGEATION | INFINITE LIBRARY</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}button,a{font:inherit}button{cursor:pointer}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#050913}#picture{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform;transition:opacity .25s}#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0207117d,transparent 25%,transparent 53%,#020711d9)}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:15px}.brand{font:500 clamp(15px,3.3vw,28px) Georgia,serif;letter-spacing:.08em;text-shadow:0 2px 12px #000}.tag{font-size:10px;letter-spacing:.13em;margin-top:7px;text-shadow:0 1px 8px #000}.tools{display:flex;gap:7px}button,.exit{background:#061b2de8;color:#fff;border:1px solid #86bfe0aa;border-radius:14px;padding:11px 13px;text-decoration:none;font-weight:700;box-shadow:0 2px 10px #0007}.tools button,.tools a{white-space:nowrap}#bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:2;text-align:center}.scenes{display:flex;gap:9px;overflow-x:auto;padding:8px 4px 12px;scrollbar-width:thin;scroll-snap-type:x proximity}.scene{flex:0 0 125px;width:125px;height:76px;position:relative;overflow:hidden;border-radius:12px;padding:0;border:2px solid #fff7;scroll-snap-align:center;background:#111}.scene img{width:100%;height:100%;object-fit:cover;display:block}.scene span{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:16px 3px 6px;font-size:12px;text-shadow:0 1px 3px #000}.scene.selected{border-color:#48b5ff;box-shadow:0 0 12px #42aaff}.scene.selected img{filter:brightness(1.05)}#title{font-size:clamp(18px,4.5vw,25px);font-weight:800;text-shadow:0 2px 10px #000}#hint{font-size:12px;color:#e1edf5;text-shadow:0 2px 7px #000;margin:5px auto 10px}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.controls button{min-width:45px}.primary{background:linear-gradient(110deg,#c3eefa,#ffe0a3);color:#092037;border:0}.status{position:fixed;top:calc(100px + env(safe-area-inset-top));left:15px;z-index:2;font-size:11px;padding:8px 12px;border-radius:12px;background:#061b2dcc;border:1px solid #fff5}#help{display:none;position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);background:#081b2bf7;border:1px solid #7fbdd8;border-radius:16px;width:min(90vw,450px);padding:20px;line-height:1.6;box-shadow:0 0 0 100vmax #0008}#help button{float:right}#help p{font-size:14px}#toast{position:fixed;z-index:4;top:40%;left:50%;transform:translateX(-50%);padding:10px 15px;background:#061b2de9;border-radius:12px;display:none;text-align:center;max-width:90vw}@media(max-width:430px){header{padding:10px}.brand{font-size:15px}.tag{font-size:8px}.tools button,.tools a{padding:9px;font-size:12px}.status{top:90px}.scene{flex-basis:110px;width:110px;height:69px}.controls button{padding:10px 12px}}
</style></head><body><div id="stage"><img id="picture" src="01_中央ホール.png" alt="中央ホール"></div><header><div><div class="brand">FORGEATION<br>INFINITE LIBRARY</div><div class="tag">DESIGN THE FUTURE. FORGE THE FUTURE.</div></div><div class="tools"><button id="guide" aria-label="操作説明">？</button><button id="fullscreen" aria-label="全画面">⛶</button><a class="exit" href="index.html">× 出る</a></div></header><div class="status">10エリア・高画質画像ビュー</div><section id="bottom"><div class="scenes" id="scenes" aria-label="エリアを選択"></div><div id="title">✦ 中央ホール</div><div id="hint">画像をスワイプして見渡す・＋／−で拡大縮小</div><div class="controls"><button id="left" aria-label="左へ">◀</button><button id="up" aria-label="上へ">▲</button><button id="down" aria-label="下へ">▼</button><button id="right" aria-label="右へ">▶</button><button id="plus" aria-label="拡大">＋</button><button id="minus" aria-label="縮小">−</button><button id="reset" aria-label="初期位置">⌖</button><button class="primary" id="next">奥へ進む ↗</button></div></section><div id="help"><button id="close">×</button><h3>FORGEATION 図書館</h3><p>下の10枚の絵コンテを選ぶと、それぞれの高画質画像に切り替わります。指でスワイプして見渡し、２本指で拡大縮小できます。「奥へ進む」で次のエリアに移ります。</p><p>現在は<strong>平面画像を使った探索プレビュー</strong>です。見えていない背面・天井・床を再現する本物の360°全天球パノラマではありません。画像を無理に球体に貼って歪ませることはしていません。</p></div><div id="toast" role="status"></div><script>
(()=>{'use strict';const names=['中央ホール','天空エリア','東の書架','西の書架','螺旋回廊','静寂の間','レインボーラウンジ','映画館エリア','夜の図書館','秘密の通路'];const files=names.map((name,i)=>`${String(i+1).padStart(2,'0')}_${name}.png`);const $=id=>document.getElementById(id),stage=$('stage'),picture=$('picture'),scenes=$('scenes');let current=0,scale=1.12,x=0,y=0,points=new Map(),startDist=0,startScale=1,lastX=0,lastY=0;function bounds(){let w=picture.naturalWidth||1,h=picture.naturalHeight||1,vw=innerWidth,vh=innerHeight,base=Math.max(vw/w,vh/h),drawW=w*base*scale,drawH=h*base*scale;return {x:Math.max(0,(drawW-vw)/2),y:Math.max(0,(drawH-vh)/2)}}function draw(){let b=bounds();x=Math.max(-b.x,Math.min(b.x,x));y=Math.max(-b.y,Math.min(b.y,y));picture.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`}function setScene(i){current=(i+names.length)%names.length;scale=1.12;x=y=0;picture.style.opacity='.35';picture.onload=()=>{draw();picture.style.opacity='1'};picture.onerror=()=>{picture.style.opacity='1';toast('画像が見つかりません：'+files[current])};picture.src=encodeURI(files[current]);picture.alt=names[current];$('title').textContent='✦ '+names[current];document.querySelectorAll('.scene').forEach((b,n)=>{b.classList.toggle('selected',n===current);b.setAttribute('aria-pressed',n===current);if(n===current)b.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'})})}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}names.forEach((name,i)=>{let b=document.createElement('button');b.className='scene';b.type='button';b.setAttribute('aria-label',name);let im=document.createElement('img');im.src=encodeURI(files[i]);im.alt='';im.loading=i<3?'eager':'lazy';let t=document.createElement('span');t.textContent=name;b.append(im,t);b.onclick=()=>setScene(i);scenes.append(b)});stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});lastX=e.clientX;lastY=e.clientY;if(points.size===2){let p=[...points.values()];startDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);startScale=scale}});stage.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;let prev=points.get(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){let p=[...points.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);scale=Math.max(1,Math.min(3.5,startScale*dist/Math.max(1,startDist)))}else{x+=e.clientX-prev.x;y+=e.clientY-prev.y}draw()});function end(e){points.delete(e.pointerId);if(points.size===1){let p=[...points.values()][0];lastX=p.x;lastY=p.y}}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(1,Math.min(3.5,scale+(e.deltaY>0?-.1:.1)));draw()},{passive:false});const pan=(dx,dy)=>{x+=dx;y+=dy;draw()};$('left').onclick=()=>pan(95,0);$('right').onclick=()=>pan(-95,0);$('up').onclick=()=>pan(0,95);$('down').onclick=()=>pan(0,-95);$('plus').onclick=()=>{scale=Math.min(3.5,scale+.2);draw()};$('minus').onclick=()=>{scale=Math.max(1,scale-.2);draw()};$('reset').onclick=()=>{scale=1.12;x=y=0;draw()};$('next').onclick=()=>setScene(current+1);$('guide').onclick=()=>$('help').style.display='block';$('close').onclick=()=>$('help').style.display='none';$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('このブラウザでは全画面表示できません'))};window.addEventListener('resize',draw);setScene(0)})();
</script></body></html>
