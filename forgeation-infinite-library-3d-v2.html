<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b19"><title>FORGEATION INFINITE LIBRARY | 360° TOUR</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b19;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}button,a{font:inherit}button{cursor:pointer}#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block;width:100%;height:100%}#fallback{position:absolute;inset:0;background-position:center;background-size:cover;display:none}#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#010612b9 0%,transparent 28%,transparent 51%,#010612e8 100%)}header{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;z-index:3;display:flex;align-items:start;justify-content:space-between;gap:8px}h1{font:clamp(17px,4.2vw,27px)/1.1 Georgia,serif;letter-spacing:.07em;margin:0;text-shadow:0 2px 10px #000}header small{display:block;margin-top:9px;font-size:clamp(8px,1.9vw,11px);letter-spacing:.12em;font-weight:800}.top{display:flex;gap:7px;flex-shrink:0}.pill{border:1px solid #85b8d0aa;border-radius:15px;background:#061e35ec;color:white;min-height:43px;padding:8px 12px;font-weight:800;text-decoration:none;display:grid;place-items:center}.bottom{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;padding:0 12px;text-align:center}.label{display:inline-block;border:1px solid #8bb5c5aa;border-radius:22px;background:#061b30e8;padding:10px 15px;font-size:12px;font-weight:700;margin-bottom:12px}.thumbs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:5px 4px 12px}.thumbs::-webkit-scrollbar{display:none}.thumb{position:relative;flex:0 0 130px;height:77px;border:2px solid #ffffff70;border-radius:14px;overflow:hidden;background:#071b30;color:#fff;scroll-snap-align:center;padding:0}.thumb.active{border-color:#48c5ff;box-shadow:0 0 0 2px #218fff66,0 0 20px #168bff}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;inset:auto 0 0;padding:15px 2px 5px;font-size:12px;font-weight:900;background:linear-gradient(transparent,#000e);text-shadow:0 1px 4px black}.title{font-size:21px;font-weight:900;margin:2px 0 3px;text-shadow:0 2px 8px #000}.hint{font-size:12px;margin-bottom:12px;text-shadow:0 2px 8px #000}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.controls button{border:1px solid #8ab5d0a8;border-radius:13px;background:#061e35ed;color:#fff;min-height:43px;min-width:44px;padding:7px 12px;font-size:17px;font-weight:900}.controls .next{background:linear-gradient(110deg,#bfeef4,#ffe2a7);color:#06172d;border:0}#status{position:fixed;top:40%;left:5%;width:90%;z-index:2;text-align:center;text-shadow:0 2px 12px black;font-weight:800;pointer-events:none}@media(max-height:700px){.label{margin-bottom:4px}.thumb{height:62px}.thumbs{padding-bottom:4px}.hint{margin-bottom:5px}.bottom{bottom:calc(env(safe-area-inset-bottom) + 4px)}}

</style></head><body><div id="stage"><div id="fallback"></div></div><div id="shade"></div><header><div><h1>FORGEATION<br>INFINITE LIBRARY</h1><small>DESIGN THE FUTURE. FORGE THE FUTURE.</small></div><div class="top"><button class="pill" id="help" aria-label="操作方法">?</button><a class="pill" href="index.html">× 出る</a></div></header><div id="status">360°空間を読み込んでいます…</div><div class="bottom"><div class="label">10エリア · 360°全天球ビュー（素材検証版）</div><div id="thumbs" class="thumbs"></div><div id="title" class="title">✦ 中央ホール</div><div class="hint">画面をスワイプして見渡す · 上下にも視点移動</div><div class="controls"><button id="left" aria-label="左">◀</button><button id="up" aria-label="上">▲</button><button id="down" aria-label="下">▼</button><button id="right" aria-label="右">▶</button><button id="reset" aria-label="正面に戻る">⌖</button><button id="photo">写真を見る</button><button class="next" id="next">奥へ進む ↗</button></div></div><div id="photoViewer" role="dialog" aria-modal="true" aria-label="写真ビュー"><button id="photoBack" type="button">↩ 360°に戻る</button><div id="photoCaption"></div><img id="photoImage" alt="選択したエリアの写真"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';const names=['中央ホール','天空エリア','東の書架','西の書架','螺旋回廊','静寂の間','レインボーラウンジ','映画館エリア','夜の図書館','秘密の通路'];const base=names.map((n,i)=>String(i+1).padStart(2,'0')+'_'+n);let current=0,yaw=0,pitch=0,fov=72,renderer,camera,scene,mesh,texture,loading=0,drag=null;const $=id=>document.getElementById(id);const thumbBox=$('thumbs');base.forEach((b,i)=>{const el=document.createElement('button');el.className='thumb';el.innerHTML='<img alt="" src="'+encodeURI(b+'.png')+'"><span>'+names[i]+'</span>';if(i===6){const im=el.querySelector('img');im.onerror=()=>{im.onerror=null;im.src=encodeURI('07_レインボーラウンジ.png')}}el.onclick=()=>show(i);thumbBox.append(el)});function status(t){$('status').textContent=t;$('status').style.display=t?'block':'none'}function view(){if(!camera)return;pitch=Math.max(-1.38,Math.min(1.38,pitch));camera.fov=fov;camera.updateProjectionMatrix();camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}function init(){if(!window.THREE){status('3Dライブラリを読み込めません。通信環境を確認してください。');return}try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);$('stage').append(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(fov,innerWidth/innerHeight,.1,100);const geo=new THREE.SphereGeometry(30,96,64);geo.scale(-1,1,1);mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));scene.add(mesh);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();view();show(0)}catch(e){status('この端末では3D表示を開始できませんでした。')}}function show(i){current=(i+10)%10;const token=++loading;const b=base[current];$('title').textContent='✦ '+names[current];[...thumbBox.children].forEach((e,n)=>{e.classList.toggle('active',n===current);if(n===current)e.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})});yaw=0;pitch=0;view();status('読み込み中…');const candidates=current===6?[encodeURI('07_レインボーラウンジ_360-development.jpg'),encodeURI('07_レインボーラウンジ_360-development.jpg')]:[encodeURI(b+'_360-development.jpg')];const loader=new THREE.TextureLoader();function tryLoad(k){loader.load(candidates[k],t=>{if(token!==loading){t.dispose();return}t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(texture)texture.dispose();texture=t;mesh.material.map=t;mesh.material.needsUpdate=true;status('')},undefined,()=>{if(token!==loading)return;if(k+1<candidates.length)tryLoad(k+1);else status('360°画像を読み込めません：'+b+'_360-development.jpg')})}tryLoad(0)}function move(dx,dy){yaw+=dx;pitch+=dy;view()}const stage=$('stage');stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};move(-dx*.0045,-dy*.0045)});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(45,Math.min(90,fov+e.deltaY*.04));view()},{passive:false});$('left').onclick=()=>move(-.25,0);$('right').onclick=()=>move(.25,0);$('up').onclick=()=>move(0,.2);$('down').onclick=()=>move(0,-.2);$('reset').onclick=()=>{yaw=0;pitch=0;fov=72;view()};$('next').onclick=()=>show(current+1);$('photo').onclick=()=>{const p=$('photoViewer');$('photoImage').src=encodeURI(base[current]+'.png');$('photoImage').alt=names[current]+'の写真';$('photoCaption').textContent=names[current];p.classList.add('open');$('photoBack').focus()};$('photoBack').onclick=()=>{$('photoViewer').classList.remove('open');$('photoImage').removeAttribute('src');$('photo').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('photoViewer').classList.contains('open'))$('photoBack').click()});$('help').onclick=()=>alert('左右にスワイプ：周囲を見渡す\n上下にスワイプ：天井・床を見る\n下の写真：エリアを切り替える\n「奥へ進む」：次のエリアへ\n※現在の360°素材は検証版であり、つなぎ目や天頂・床の描写が完全ではありません。');init()})();
</script></body></html>
