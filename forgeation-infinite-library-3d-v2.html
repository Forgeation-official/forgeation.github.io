</script><script id="libraryBooksScript">
(()=>{'use strict';
let BOOKS=[{"id": 1, "title": "はじめての図書館", "area": 0, "desc": "この図書館は、知りたい気持ちを大切にする場所です。", "chapters": [{"title": "本の読み方", "text": "本は、最初から最後まで読まなくてもかまいません。目次を眺め、気になる章を選ぶだけでも新しい発見があります。わからない言葉に出会ったら、その場で意味を調べたり、自分の言葉に置き換えたりしてみましょう。"}, {"title": "自分の本棚を作ろう", "text": "好きな題材を三つ書き出してみましょう。たとえば、電車、宇宙、料理。そこから関連する本を一冊ずつ選び、読んでわかったことを一行残します。読書の楽しさは、冊数ではなく発見の数にもあります。"}]}, {"id": 2, "title": "夜空を見上げる科学", "area": 1, "desc": "星を見つめることから、科学の旅が始まります。", "chapters": [{"title": "光と星", "text": "夜空の星は、遠く離れた天体です。星の光が地球に届くまでには時間がかかります。遠い星を観察することは、昔の宇宙の姿を見ることでもあります。"}, {"title": "観察のすすめ", "text": "同じ場所で、同じ時刻に空を見てみましょう。月の形や星の位置の変化に気づくはずです。気づいたことを日付と一緒に記録すれば、自分だけの観察ノートが完成します。"}]}, {"id": 3, "title": "物語の入口", "area": 2, "desc": "物語を読むと、まだ知らない人生に出会えます。", "chapters": [{"title": "主人公の目線", "text": "同じ出来事でも、見る人が変われば意味が変わります。主人公がなぜその行動を選んだのか、ほかの選択肢はなかったのか。そんな問いを持つと、物語はもっと立体的になります。"}, {"title": "一文から想像する", "text": "「扉の向こうから、風の音がした。」この一文から、どんな場所を思い浮かべますか。海辺、山の家、宇宙船。想像した景色を三行で書いてみましょう。"}]}, {"id": 4, "title": "地図から始まる世界史", "area": 3, "desc": "場所を知ると、歴史の出来事がつながります。", "chapters": [{"title": "地図と暮らし", "text": "川の近くには水を使った暮らしが生まれ、港には人や物が集まります。地形や気候は、都市の発展に大きな影響を与えてきました。"}, {"title": "昔と今を比べる", "text": "今住んでいる地域の古い地図と新しい地図を比べると、道や鉄道、建物の変化が見えてきます。歴史は遠い国だけでなく、身近な町にも残っています。"}]}, {"id": 5, "title": "考える力の数学とAI", "area": 4, "desc": "数学もプログラミングも、考えを順序立てる練習です。", "chapters": [{"title": "問題を小さくする", "text": "難しい問題に出会ったら、条件を一つずつ書き出します。何がわかっていて、何を求めるのか。小さな問題に分けると、解決への道筋が見えてきます。"}, {"title": "AIと人の役割", "text": "AIは文章の整理や案出しを助けますが、答えが常に正しいとは限りません。計算や根拠を確かめ、最後に判断するのは人間です。AIを仲間として使いながら、自分の考える力も育てましょう。"}]}, {"id": 6, "title": "問いを育てる時間", "area": 5, "desc": "正解が一つでない問いも、学びの大切な入口です。", "chapters": [{"title": "なぜを重ねる", "text": "「なぜそう思ったのか」と自分に尋ねると、考えの奥にある経験や価値観が見えてきます。相手の答えが違っても、すぐに否定せず理由を聞いてみましょう。"}, {"title": "心を整える", "text": "考えがまとまらないときは、短い文章にして書き出してみます。事実と気持ちを分けるだけで、次にできることが少し見えやすくなります。"}]}, {"id": 7, "title": "にじいろの小さな冒険", "area": 6, "desc": "子どもも大人も楽しめる、オリジナルの短いお話です。", "chapters": [{"title": "あおい鳥の落とし物", "text": "ある朝、あおい鳥は虹のかけらを見つけました。「これはだれのものだろう？」森の仲間にたずねても、だれも知りません。鳥は、かけらを空にかざしてみました。すると、きらきらした道が現れました。"}, {"title": "虹のむこう", "text": "道の先には、雨上がりの花畑がありました。虹のかけらは、そこにいた小さな雲のものでした。「さがしてくれてありがとう！」雲が笑うと、空いっぱいに虹が広がりました。鳥は思いました。だれかのために動くと、世界は少し明るくなるんだ。"}]}, {"id": 8, "title": "映画をもっと楽しむ本", "area": 7, "desc": "映像の見方を知ると、一つの場面がもっと面白くなります。", "chapters": [{"title": "画面が語ること", "text": "映画では、台詞がなくても光、色、音、カメラの動きで気持ちを伝えます。登場人物が小さく映る場面には、広い世界での孤独が表現されているかもしれません。"}, {"title": "鑑賞ノート", "text": "映画を見終えたら、心に残った場面を一つ選びましょう。何が映っていたか、どんな音が聞こえたか、なぜ心に残ったか。三つの視点で書くと、自分の感想がより豊かになります。"}]}, {"id": 9, "title": "健康と支え合いの基礎", "area": 8, "desc": "健康や福祉を考えるための、やさしい入門書です。", "chapters": [{"title": "健康を支えるもの", "text": "健康は、食事や運動だけでなく、睡眠、人とのつながり、安心して過ごせる環境にも支えられています。自分に合う生活の工夫を少しずつ見つけることが大切です。"}, {"title": "相手の話を聞く", "text": "誰かを支えるとき、すぐに答えを出すことだけが助けではありません。困っていることを丁寧に聞き、本人が望むことを確かめる姿勢も大切です。この本は一般的な学習用で、医療上の判断に代わるものではありません。"}]}, {"id": 10, "title": "未来をつくる小さな一歩", "area": 9, "desc": "Forgeationオリジナル。挑戦のきっかけを見つける本です。", "chapters": [{"title": "才能の種", "text": "得意なことがまだ見つからなくても、好きなことや気になることの中に才能の種が隠れているかもしれません。昨日より少し詳しくなること、誰かに教えてみること。その積み重ねが、自分らしい道につながります。"}, {"title": "未来へのメモ", "text": "やってみたいことを一つ選び、今日できる最小の行動を書いてみましょう。大きな夢でも、最初の一歩は小さくてかまいません。未来は、考えることと行動することの間から形になっていきます。"}]}], THEMES=["総合案内・新着図書", "宇宙・天文学・科学", "日本文学・世界文学", "歴史・地理・社会", "数学・IT・AI", "哲学・心理学・思想", "絵本・児童書・教育", "映画・芸術・音楽", "医療・福祉・健康", "Forgeationオリジナル作品"];

// 蔵書は別ファイルで管理。JSON未公開時も初期10冊で動作を継続する。
async function loadCatalog(){
 try{
  const response=await fetch('./forgeation-library-books.json',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!data||!Array.isArray(data.books)||!Array.isArray(data.themes))throw new Error('Invalid catalog');
  const valid=data.books.filter(b=>b&&typeof b.title==='string'&&Number.isInteger(b.area)&&b.area>=0&&b.area<10&&Array.isArray(b.chapters)&&b.chapters.length&&b.chapters.every(c=>typeof c.title==='string'&&typeof c.text==='string'));
  if(!valid.length)throw new Error('Empty catalog');
  BOOKS=valid;THEMES=data.themes;
  const note=document.getElementById('libNotice');
  if(note)note.textContent='Forgeation蔵書データを読み込みました。実在書籍の書誌情報を表示しています。本文の閲覧可否は提供元で確認してください。';
  if(document.getElementById('libraryPanel')?.classList.contains('open'))renderBooks();
 }catch(e){BOOKS=[];const note=document.getElementById('libNotice');if(note)note.textContent='蔵書データを読み込めませんでした。JSONの配置と通信状態を確認してください。';console.warn('蔵書JSONの読み込みに失敗:',e.message)}
}
const names=['中央ホール','天空エリア','東の書架','西の書架','螺旋回廊','静寂の間','レインボーラウンジ','映画館エリア','夜の図書館','秘密の通路'];
const top=document.querySelector('header .top'),controls=document.querySelector('.controls');
const topBtn=document.createElement('button');topBtn.id='bookFindTop';topBtn.className='pill';topBtn.textContent='📚 本を探す';top.insertBefore(topBtn,top.firstChild);
const bottomBtn=document.createElement('button');bottomBtn.id='bookFindBottom';bottomBtn.textContent='📚 本を探す';controls.insertBefore(bottomBtn,document.getElementById('photo'));
const hotspot=document.createElement('button');hotspot.id='bookHotspot';hotspot.textContent='📚 このエリアの本棚を開く';hotspot.title='現在のエリアの本棚';document.body.append(hotspot);

const panel=document.createElement('section');panel.id='libraryPanel';panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','図書館の本棚');panel.innerHTML=`<div class="libHead"><strong>FORGEATION · BOOKS</strong><button id="libClose" type="button">↩ 360°に戻る</button></div><div id="libBrowse"><h2>📚 本棚を探す</h2><p>10エリアの書架から本を選び、ここで読むことができます。</p><input id="libSearch" type="search" placeholder="本のタイトル・キーワードで検索" aria-label="蔵書を検索"><div id="libThemes"></div><div id="libCount"></div><div id="libGrid"></div><p id="libNotice">現在は動作確認用のForgeationオリジナル短編・入門書10冊です。既存の著作物の全文を無断収録したものではありません。今後、利用許諾を確認した蔵書を増やせる構成です。</p></div><div id="libReader"><button id="libBack">← 本棚へ戻る</button><h2 id="readerTitle"></h2><p id="readerDesc"></p><article class="paper"><h3 id="chapterTitle"></h3><p id="chapterText"></p></article><div class="readerNav"><button id="prevChapter">← 前の章</button><span id="chapterNum"></span><button id="nextChapter">次の章 →</button></div></div>`;document.body.append(panel);
const $=id=>document.getElementById(id);let filter=-1,selected=null,chapter=0,previousFocus=null,readerFromShelf=false;
function area(){const t=$('title').textContent;const n=names.findIndex(n=>t.includes(n));return n<0?0:n}
function renderThemes(){const box=$('libThemes');box.replaceChildren();[-1,...names.map((_,i)=>i)].forEach(i=>{const b=document.createElement('button');b.textContent=i<0?'すべて':names[i];b.className=filter===i?'selected':'';b.setAttribute('aria-pressed',filter===i?'true':'false');b.onclick=()=>{filter=i;renderThemes();renderBooks()};box.append(b)})}
function renderBooks(){const q=$('libSearch').value.trim().toLocaleLowerCase();const found=BOOKS.filter(b=>(filter<0||b.area===filter)&&(b.title+' '+b.desc+' '+names[b.area]+' '+THEMES[b.area]).toLocaleLowerCase().includes(q));$('libCount').textContent=`${found.length}冊表示 / 登録 ${BOOKS.length}冊`;const grid=$('libGrid');grid.replaceChildren();found.forEach(b=>{const btn=document.createElement('button');const cover=document.createElement('span');cover.className='cover';cover.textContent=b.title;const title=document.createElement('strong');title.textContent=b.title;const meta=document.createElement('small');meta.textContent=names[b.area]+' · 読む';btn.append(cover,title,meta);btn.onclick=()=>read(b,0);grid.append(btn)});if(!found.length)grid.textContent='該当する本はありません。検索条件を変更してください。'}
 const shelf=document.createElement('section');shelf.id='realShelf';shelf.setAttribute('role','dialog');shelf.setAttribute('aria-modal','true');shelf.setAttribute('aria-label','実写風の本棚');shelf.innerHTML=`<div class="shelfPhoto" id="shelfPhoto"></div><div class="shelfVignette"></div><div class="shelfContent"><div class="shelfTop"><div class="shelfBrand">FORGEATION · INFINITE LIBRARY</div><button type="button" id="shelfReturn">↩ 360°に戻る</button></div><h2 id="shelfHeading"></h2><p class="shelfSub">本の背表紙に触れて、書籍情報を開く</p><div class="woodCase" id="shelfWood"></div><p class="shelfFoot">登録されている実在書籍の書誌案内です。表紙・本文の複製ではありません。<br>館内で読めない作品は、正規の提供元でご確認ください。</p></div>`;document.body.append(shelf);
 function closeShelf(){shelf.classList.remove('open');setTimeout(()=>{if(!shelf.classList.contains('open'))shelf.style.display='none'},660);document.body.style.overflow='';hotspot.focus()}
 $('shelfReturn').onclick=closeShelf;
 function approachShelf(areaFilter){
   // 共通の実写風書架画像を使用。登録書籍の背表紙はJSONから動的に描画。
   $('shelfPhoto').style.backgroundImage='url("forgeation-library-shelf-realistic.webp")';
   $('shelfHeading').textContent=names[areaFilter]+'の書架';
   const wood=$('shelfWood');wood.replaceChildren();
   const areaBooks=BOOKS.filter(b=>b.area===areaFilter);
   if(!areaBooks.length){const e=document.createElement('p');e.className='shelfEmpty';e.textContent='このエリアの登録書籍はまだありません。';wood.append(e)}
   else{for(let i=0;i<areaBooks.length;i+=8){const row=document.createElement('div');row.className='shelfRow';areaBooks.slice(i,i+8).forEach(b=>{const spine=document.createElement('button');spine.className='bookSpine';spine.type='button';spine.textContent=b.title;spine.title=b.title+' ／ '+(b.author||'著者情報なし');spine.setAttribute('aria-label',b.title+'の書誌情報を開く');spine.onclick=()=>{readerFromShelf=true;openLibrary(areaFilter,true);read(b,0)};row.append(spine)});wood.append(row)}}
   shelf.style.display='block';requestAnimationFrame(()=>shelf.classList.add('open'));document.body.style.overflow='hidden';$('shelfReturn').focus();
 }
function openLibrary(areaFilter,fromShelf=false){if(!fromShelf)readerFromShelf=false;previousFocus=document.activeElement;filter=areaFilter;$('libSearch').value='';$('libReader').classList.remove('open');$('libBrowse').style.display='block';renderThemes();renderBooks();panel.classList.add('open');panel.scrollTop=0;document.body.style.overflow='hidden';$('libClose').focus()}
function closeLibrary(){panel.classList.remove('open');readerFromShelf=false;if(shelf.classList.contains('open'))closeShelf();document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
function read(b,n){selected=b;chapter=n;$('libBrowse').style.display='none';$('libReader').classList.add('open');$('readerTitle').textContent=b.title;$('readerDesc').textContent=b.desc;$('chapterTitle').textContent=b.chapters[n].title;$('chapterText').textContent=b.chapters[n].text;$('chapterNum').textContent=`${n+1} / ${b.chapters.length}`;$('prevChapter').disabled=n===0;$('nextChapter').disabled=n===b.chapters.length-1;panel.scrollTop=0}
loadCatalog();
topBtn.onclick=()=>openLibrary(-1);bottomBtn.onclick=()=>openLibrary(-1);hotspot.onclick=()=>approachShelf(area());$('libClose').onclick=closeLibrary;$('libSearch').addEventListener('input',renderBooks);$('libBack').onclick=()=>{if(readerFromShelf){panel.classList.remove('open');readerFromShelf=false;document.body.style.overflow='hidden';$('shelfReturn').focus();}else{$('libReader').classList.remove('open');$('libBrowse').style.display='block';panel.scrollTop=0}};$('prevChapter').onclick=()=>{if(selected&&chapter>0)read(selected,chapter-1)};$('nextChapter').onclick=()=>{if(selected&&chapter<selected.chapters.length-1)read(selected,chapter+1)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open')){e.stopImmediatePropagation();closeLibrary()}else if(e.key==='Escape'&&shelf.classList.contains('open')){e.stopImmediatePropagation();closeShelf()}} ,true);
})();
</script></body></html>
