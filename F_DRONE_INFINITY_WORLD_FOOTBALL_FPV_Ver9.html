<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>F DRONE ∞ — WORLD FOOTBALL FPV</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#app{position:fixed;inset:0;background:#020711}
#scene{position:absolute;inset:0;background:#061425 center/cover no-repeat;transform:scale(1.08);transition:background-image .65s ease,filter .25s ease;will-change:transform,background-position;filter:saturate(1.08) contrast(1.06)}
#scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,8,20,.18),transparent 34%,transparent 65%,rgba(0,6,15,.56)),radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.22) 100%);pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 12px #000}
.top{position:absolute;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{display:flex;align-items:center;gap:10px;background:rgba(2,10,22,.72);border:1px solid rgba(96,220,255,.45);backdrop-filter:blur(12px);padding:9px 12px;border-radius:15px;font-weight:900;letter-spacing:.06em}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:italic;font-size:23px;background:linear-gradient(145deg,#13b8ff,#125ce7 60%,#ff6d4d)}
.telemetry{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:rgba(2,10,22,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);padding:8px 10px;border-radius:12px;font-size:12px;font-weight:800}
.dest{position:absolute;top:12%;left:50%;transform:translateX(-50%);text-align:center;min-width:260px}
.dest b{font-size:clamp(18px,2.4vw,32px);letter-spacing:.08em}.dest small{display:block;margin-top:6px;opacity:.82;letter-spacing:.18em}
.cross{position:absolute;left:50%;top:48%;width:34px;height:34px;transform:translate(-50%,-50%)}
.cross:before,.cross:after{content:"";position:absolute;background:rgba(255,255,255,.86);box-shadow:0 0 10px #5fe6ff}.cross:before{width:34px;height:1px;top:16px}.cross:after{height:34px;width:1px;left:16px}
.record{position:absolute;left:18px;top:82px;font-size:12px;font-weight:900;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:10px}.dot{color:#ff3b48}
.bottomInfo{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);background:rgba(2,10,22,.66);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);padding:8px 14px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap}
.controls{position:absolute;inset:0;pointer-events:auto}
.stick{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:1px solid rgba(137,230,255,.55);background:radial-gradient(circle,rgba(16,75,100,.55),rgba(2,10,22,.72));box-shadow:inset 0 0 25px rgba(0,190,255,.16),0 8px 30px rgba(0,0,0,.3);touch-action:none}
#leftStick{left:max(22px,env(safe-area-inset-left))}#rightStick{right:max(22px,env(safe-area-inset-right))}
.knob{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#87f1ff,#0c8eb5 45%,#073d55);border:2px solid #b9f7ff;box-shadow:0 0 22px rgba(55,218,255,.55)}
.next{position:absolute;right:max(18px,env(safe-area-inset-right));top:82px;border:1px solid #62ddff;background:rgba(2,12,25,.72);color:white;padding:10px 14px;border-radius:13px;font-weight:900;backdrop-filter:blur(10px)}
.hint{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;font-size:11px;opacity:.8;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#020711;z-index:9;transition:opacity .5s}
#loading .box{text-align:center}.spinner{width:48px;height:48px;border:3px solid #18334b;border-top-color:#55dcff;border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:650px){.stick{width:96px;height:96px}.bottomInfo{bottom:125px}.hint{display:none}.chip:nth-child(-n+2){display:none}.dest{top:15%}}
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div id="hud">
    <div class="top">
      <div class="brand"><span class="logo">F</span><span>F DRONE ∞</span></div>
      <div class="telemetry"><span class="chip" id="gps">GPS ●●●●</span><span class="chip" id="bat">BAT 98%</span><span class="chip" id="alt">ALT 34m</span><span class="chip" id="spd">SPD 0km/h</span></div>
    </div>
    <div class="record"><span class="dot">●</span> REC &nbsp; 4K LIVE</div>
    <div class="dest"><b id="title">TOKYO FOOTBALL SKY</b><small id="sub">FPV CAMERA / WORLD JOURNEY</small></div>
    <div class="cross"></div>
    <div class="bottomInfo" id="info">AI ROBOTICS LAB → LIVE FPV</div>
  </div>
  <div class="controls">
    <button class="next" id="next">NEXT DESTINATION →</button>
    <div class="stick" id="leftStick"><div class="knob"></div></div>
    <div class="stick" id="rightStick"><div class="knob"></div></div>
    <div class="hint">LEFT: MOVE / STRAFE　　RIGHT: YAW / ALTITUDE</div>
  </div>
  <div id="loading"><div class="box"><div class="spinner"></div><b>F DRONE ∞ CONNECTING FPV…</b><div style="opacity:.65;margin-top:8px;font-size:12px">AI ROBOTICS LAB</div></div></div>
</div>
<script>
const scenes=[
 {t:"TOKYO FOOTBALL SKY",s:"METROPOLIS / STADIUM",u:"https://static.szombathely.hu/image/2017/10/hali.jpg"},
 {t:"SINGAPORE BAY FOOTBALL",s:"BAY / CITY LIGHTS",u:"https://cnn-arabic-images.cnn.io/cloudinary/image/upload/w_1920%2Cc_scale%2Cq_auto/cnnarabic/2021/06/21/images/187593.jpg"},
 {t:"LONDON FOOTBALL NIGHT",s:"URBAN / NIGHT MATCH",u:"https://static.szombathely.hu/image/2017/10/hali.jpg"},
 {t:"SPAIN SUNSET ARENA",s:"SUNSET / FOOTBALL CULTURE",u:"https://www.paokmania.gr/sites/default/files/styles/og_image/public/2024-10/417591583_1511284826113938_2461151569205382265_n.jpg?itok=qz9PB5kD"},
 {t:"GERMANY NIGHT ARENA",s:"FLOODLIGHTS / CITY",u:"https://cnn-arabic-images.cnn.io/cloudinary/image/upload/w_1920%2Cc_scale%2Cq_auto/cnnarabic/2021/06/21/images/187593.jpg"},
 {t:"ITALIA CITY FOOTBALL",s:"CITY / STADIUM",u:"https://static.szombathely.hu/image/2017/10/hali.jpg"},
 {t:"SOUTH AMERICA FOOTBALL",s:"PASSION / CITY",u:"https://www.paokmania.gr/sites/default/files/styles/og_image/public/2024-10/417591583_1511284826113938_2461151569205382265_n.jpg?itok=qz9PB5kD"},
 {t:"COAST FOOTBALL FLIGHT",s:"OCEAN / STADIUM",u:"https://www.paokmania.gr/sites/default/files/styles/og_image/public/2024-10/417591583_1511284826113938_2461151569205382265_n.jpg?itok=qz9PB5kD"},
 {t:"MOUNTAIN FOOTBALL VALLEY",s:"MOUNTAINS / TWILIGHT",u:"https://24906865.fs1.hubspotusercontent-eu1.net/hubfs/24906865/Imported_Blog_Media/dji_20250204174511_0102_d-hdr-2.jpg"},
 {t:"FUTURE NIGHT FOOTBALL",s:"FUTURE CITY / ∞ JOURNEY",u:"https://cnn-arabic-images.cnn.io/cloudinary/image/upload/w_1920%2Cc_scale%2Cq_auto/cnnarabic/2021/06/21/images/187593.jpg"}
];
let idx=0,x=50,y=50,zoom=1.08,alt=34,speed=0,yaw=0;
const scene=document.querySelector("#scene"),title=document.querySelector("#title"),sub=document.querySelector("#sub");
const altEl=document.querySelector("#alt"),spdEl=document.querySelector("#spd"),batEl=document.querySelector("#bat");
function loadScene(i){
 idx=(i+scenes.length)%scenes.length; const d=scenes[idx];
 title.textContent=d.t; sub.textContent=d.s+" / FPV CAMERA";
 const img=new Image(); img.onload=()=>{scene.style.backgroundImage=`url("${d.u}")`;};
 img.onerror=()=>{scene.style.backgroundImage="linear-gradient(135deg,#0a2a46,#03101d)";};
 img.src=d.u;
}
function render(){
 scene.style.backgroundPosition=`${x}% ${y}%`;
 scene.style.transform=`scale(${zoom}) rotate(${yaw*.05}deg)`;
 altEl.textContent=`ALT ${Math.round(alt)}m`; spdEl.textContent=`SPD ${Math.round(speed)}km/h`;
}
function stick(el,onMove){
 const knob=el.querySelector(".knob"); let active=false;
 function move(e){
  if(!active)return; const r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
  let dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),lim=r.width*.34;
  if(m>lim){dx*=lim/m;dy*=lim/m}
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  onMove(dx/lim,dy/lim);
 }
 function down(e){active=true;move(e);e.preventDefault()}
 function up(){active=false;knob.style.transform="translate(-50%,-50%)";speed*=.45;render()}
 el.addEventListener("pointerdown",down); window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
 el.addEventListener("touchstart",down,{passive:false}); window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
}
stick(document.querySelector("#leftStick"),(sx,sy)=>{x=Math.max(8,Math.min(92,x+sx*.7));y=Math.max(8,Math.min(92,y+sy*.55));speed=Math.min(48,Math.hypot(sx,sy)*42);zoom=Math.max(1.02,Math.min(1.38,zoom-sy*.008));render()});
stick(document.querySelector("#rightStick"),(sx,sy)=>{yaw=Math.max(-8,Math.min(8,yaw+sx*.4));alt=Math.max(5,Math.min(120,alt-sy*1.2));y=Math.max(8,Math.min(92,y-sy*.18));render()});
document.querySelector("#next").onclick=()=>loadScene(idx+1);
let battery=98; setInterval(()=>{battery=Math.max(12,battery-.02);batEl.textContent=`BAT ${Math.floor(battery)}%`},1500);
window.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="w"){y-=1;zoom+=.01;speed=18}if(k==="s"){y+=1;zoom-=.01;speed=10}if(k==="a")x-=1;if(k==="d")x+=1;if(e.key==="ArrowUp")alt+=1;if(e.key==="ArrowDown")alt-=1;if(e.key==="ArrowLeft")yaw-=1;if(e.key==="ArrowRight")yaw+=1;x=Math.max(8,Math.min(92,x));y=Math.max(8,Math.min(92,y));zoom=Math.max(1.02,Math.min(1.38,zoom));render()});
loadScene(0);render();setTimeout(()=>{const l=document.querySelector("#loading");l.style.opacity=0;setTimeout(()=>l.remove(),550)},1100);
</script>
</body>
</html>
